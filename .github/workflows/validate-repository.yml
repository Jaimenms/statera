# REUSABLE workflow: validates a data repository created by `statera init` (folders content/,
# publications/, docs/). Statera comes from pyproject.toml at the repository root, at the version pinned
# in uv.lock.
#
#   jobs:
#     statera:
#       uses: Jaimenms/statera/.github/workflows/validate-repository.yml@v0.3.0
#       secrets: {statera-ssh-key: "${{ secrets.STATERA_SSH_KEY }}"}
#
# The ci.yml generated by `statera init` runs `statera check --all`; use this workflow when you prefer the
# steps to follow the framework version.
name: validate-repository

on:
  workflow_call:
    inputs:
      root:
        description: Repository root (where pyproject.toml and uv.lock live)
        type: string
        default: .
      level:
        description: Conformance level required of all products (0 = the target declared by each one)
        type: number
        default: 0
      demo:
        description: Runs the full process with synthetic data and publishes the documentation as an artifact
        type: boolean
        default: false
    secrets:
      statera-ssh-key:
        description: Deploy key with read access to the Statera repository (if it is private)
        required: false

permissions:
  contents: read

env:
  STATERA_REQUIRE: pspp,r  # in CI, rule cases with legacy code (PSPP, R) are required

jobs:
  validate:
    name: Generated files, validation and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        if: ${{ env.HAS_KEY == 'true' }}
        env: {HAS_KEY: "${{ secrets.statera-ssh-key != '' }}"}
        with: {ssh-private-key: "${{ secrets.statera-ssh-key }}"}
      - uses: astral-sh/setup-uv@v6
      - name: GNU PSPP and R (legacy code called by Python models)
        run: sudo apt-get update -q && sudo apt-get install -y -q pspp r-base-core
      - name: Validation (including up-to-date generated files), lint and tests
        run: uv run --locked --all-groups statera check --all
      - name: Conformance level required of all products
        if: ${{ inputs.level > 0 }}
        run: uv run --locked --all-groups statera validate --level ${{ inputs.level }}
      - name: Demo and documentation
        if: ${{ inputs.demo }}
        env: {STATERA_REGISTRY: "${{ runner.temp }}/registry"}
        run: uv run --locked --all-groups statera demo
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.demo }}
        with: {name: docs, path: "${{ inputs.root }}/content/docs/"}
