# CI for the framework itself: lint and tests (without any organization) and the foo-bar example end to end.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  STATERA_REQUIRE: pspp,r

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "${{ matrix.python }}"}
      - name: GNU PSPP and R (tests with the real legacy code only run where these exist)
        run: sudo apt-get update -q && sudo apt-get install -y -q pspp r-base-core
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q

  example:
    name: foo-bar example end to end
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/foo-bar
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update -q && sudo apt-get install -y -q pspp r-base-core
      - run: uv run --locked statera check --all
      - run: uv run --locked statera demo
