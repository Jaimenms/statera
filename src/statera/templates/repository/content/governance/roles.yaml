# Roles (not people): they survive team changes. Adjust the units and teams to your organization.
roles:
  - {id: data-team, name: Data team, org_unit: "000000", git_team: "@your-org/data-team"}
  - {id: curator, name: Repository curation, org_unit: "000000", git_team: "@your-org/curation"}
  - {id: data-protection-officer, name: Data protection officer, org_unit: "000000", git_team: "@your-org/data-protection-officer"}
