# Statera DATA REPOSITORY template (Copier): `statera init <folder>`.
_min_copier_version: "9.4"
_answers_file: .copier-answers.yml
_templates_suffix: .jinja

name:
  type: str
  help: Data repository name (lowercase and hyphens), e.g. labor-stats
  validator: "{% if not (name | regex_search('^[a-z0-9-]+$')) %}Use lowercase letters, digits and hyphens{% endif %}"
organization:
  type: str
  help: Organization or program (avoid department names, which change)
namespace:
  type: str
  help: Namespace of all identifiers, e.g. org.example.labor-stats
acronym:
  type: str
  default: "{{ name }}"
statera_git:
  type: str
  default: ssh://git@github.com/Jaimenms/statera.git
statera_version:
  type: str
  default: "0.9.2"
