# Product template of the statera standard (Copier). Unlike Cookiecutter, Copier UPDATES
# products already created when the template evolves: `copier update` inside the product folder.
_min_copier_version: "9.4"
_answers_file: .copier-answers.yml
_templates_suffix: .jinja

product:
  type: str
  help: Product identifier (lowercase and hyphens), e.g. monthly-earnings
  validator: "{% if not (product | regex_search('^[a-z0-9-]+$')) %}Use lowercase letters, digits and hyphens{% endif %}"
title:
  type: str
  help: Product name
namespace:
  type: str
  help: Organization namespace (statera.toml), e.g. org.example.labor-stats
alignment:
  type: str
  help: >-
    Role in the product mesh (specification 09): consumer = dissemination (public); aggregate =
    internal canonical entity read by several products; source = internal extraction from a system
  default: consumer
  choices: [consumer, aggregate, source]
theme:
  type: str
  default: tbd
  when: "{{ alignment == 'consumer' }}"
frequency:
  type: str
  default: monthly
  choices: [monthly, quarterly, semiannual, annual]
  when: "{{ alignment == 'consumer' }}"
purpose:
  type: str
  default: official-release
  when: "{{ alignment == 'consumer' }}"
curator:
  type: str
  help: Curator role (from governance/roles.yaml); `statera new-product` uses the one in shared-owners.yaml
  default: curator
technical_owner:
  type: str
  help: Technical owner role (from governance/roles.yaml)
  default: data-team
data_protection_officer:
  type: str
  default: data-protection-officer
