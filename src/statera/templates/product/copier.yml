# Modelo de produto do padrão statera (Copier). Diferente do Cookiecutter, o Copier ATUALIZA
# produtos já criados quando o modelo evolui: `copier update` dentro da pasta do produto.
_min_copier_version: "9.4"
_answers_file: .copier-answers.yml
_templates_suffix: .jinja

product:
  type: str
  help: Identificador do produto (minúsculas e hífens), ex. rais-mensalizada
  validator: "{% if not (product | regex_search('^[a-z0-9-]+$')) %}Use minúsculas, números e hífens{% endif %}"
title:
  type: str
  help: Nome do produto
namespace:
  type: str
  help: Espaço de nomes do órgão (statera.toml), ex. br.gov.estat-trabalho
alignment:
  type: str
  help: >-
    Papel na malha de produtos (especificação 09): consumer = divulgação (público); aggregate =
    entidade canônica interna lida por vários produtos; source = extração interna de um sistema
  default: consumer
  choices: [consumer, aggregate, source]
theme:
  type: str
  default: a-definir
  when: "{{ alignment == 'consumer' }}"
frequency:
  type: str
  default: monthly
  choices: [monthly, quarterly, semiannual, annual]
  when: "{{ alignment == 'consumer' }}"
purpose:
  type: str
  default: official-release
  when: "{{ alignment == 'consumer' }}"
curator:
  type: str
  help: Papel curador (de governance/roles.yaml); o `statera new-product` usa o de shared-owners.yaml
  default: curator
technical_owner:
  type: str
  help: Papel dono técnico (de governance/roles.yaml)
  default: data-team
data_protection_officer:
  type: str
  default: data-protection-officer
