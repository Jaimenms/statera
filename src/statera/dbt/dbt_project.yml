# dbt package of the Statera framework: the standard's macros and generic tests.
# Installed by each organization's dbt project via packages.yml (local in the demo; git in production).
name: statera
version: "0.1.0"
config-version: 2
require-dbt-version: [">=1.10.0", "<2.0.0"]
macro-paths: [macros]
