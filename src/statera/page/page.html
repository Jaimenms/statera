<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog</title>
<!--STATERA-CATALOG-HEAD-->
<style>
:root {
  --bg: #fbfaf7; --panel: #ffffff; --side: #f3f1ec; --ink: #1d2327; --soft: #5c666e; --line: #dedad2;
  --accent: #0b6e69; --accent-soft: #e0f0ee; --warn: #8a5200; --warn-soft: #fbf0d9;
  --code-bg: #f6f4ef; --kw: #8a3ea8; --str: #1f6f3d; --num: #a2501a; --com: #6f787f; --jin: #b0306a;
  --fill: #ffe9a8; --fill-ink: #3d2f00; --miss: #ffd5cf; --miss-ink: #7a1c10;
  --gold: #9a7b0a; --silver: #6b6b6b; --bronze: #9c5b2e; --ref: #2f6497;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --logo-h: 30px;
}
/* The dark colors, twice: when the reader's system asks for them (unless the theme fixes the light ones) and
   when the theme fixes them. A theme's own colors come after, in the block below this one (statera.page.theme). */
@media (prefers-color-scheme: dark) {
  :root:not([data-mode="light"]) {
    --bg: #15191c; --panel: #1c2125; --side: #111417; --ink: #e6e3dc; --soft: #9aa4ab; --line: #2e353a;
    --accent: #5ac8bf; --accent-soft: #17332f; --warn: #f0b858; --warn-soft: #3a2c10;
    --code-bg: #101315; --kw: #cf9bea; --str: #8fd3a3; --num: #f0a877; --com: #7f8a91; --jin: #f08fb8;
    --fill: #5a4a12; --fill-ink: #ffe9a8; --miss: #5a211a; --miss-ink: #ffc9c1;
    --gold: #e0c14a; --silver: #b5b5b5; --bronze: #d99a6c; --ref: #7fb2e5;
  }
  :root:not([data-mode="light"]) .logo.for-light { display: none; }
  :root:not([data-mode="light"]) .logo.for-dark { display: block; }
}
:root[data-mode="dark"] {
  --bg: #15191c; --panel: #1c2125; --side: #111417; --ink: #e6e3dc; --soft: #9aa4ab; --line: #2e353a;
  --accent: #5ac8bf; --accent-soft: #17332f; --warn: #f0b858; --warn-soft: #3a2c10;
  --code-bg: #101315; --kw: #cf9bea; --str: #8fd3a3; --num: #f0a877; --com: #7f8a91; --jin: #f08fb8;
  --fill: #5a4a12; --fill-ink: #ffe9a8; --miss: #5a211a; --miss-ink: #ffc9c1;
  --gold: #e0c14a; --silver: #b5b5b5; --bronze: #d99a6c; --ref: #7fb2e5;
}
:root[data-mode="dark"] .logo.for-light { display: none; }
:root[data-mode="dark"] .logo.for-dark { display: block; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: .92em; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--soft); }

/* the bar on top: where one is, and the search */
.head { position: sticky; top: 0; z-index: 5; }
.notice { background: var(--warn-soft); color: var(--warn); text-align: center; font-size: 12.5px; letter-spacing: .04em; padding: 3px 12px; }
.top { display: flex; align-items: center; gap: 16px; padding: 9px 18px; background: var(--top, var(--side));
  color: var(--top-ink, var(--ink)); border-bottom: 1px solid var(--line); }
.brand { color: inherit; min-width: 236px; max-width: 460px; flex: 0 1 auto; display: flex; align-items: center; gap: 11px; line-height: 1.25; }
.brand .names { display: flex; flex-direction: column; min-width: 0; }
.logo { height: var(--logo-h); width: auto; display: block; flex: none; } .logo.for-dark { display: none; }
.toplinks { margin-left: auto; display: flex; gap: 16px; font-size: 13.5px; white-space: nowrap; }
.toplinks a { color: inherit; }
nav .links { display: none; margin-top: 18px; border-top: 1px solid var(--line); padding-top: 8px; }
nav .links a { display: block; padding: 4px 8px; font-size: 13.5px; }
.brand:hover { text-decoration: none; }
.brand b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .names span { opacity: .72; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.find { position: relative; flex: 1; max-width: 640px; }
.find input { width: 100%; padding: 8px 40px 8px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--ink); font: inherit; }
.find input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.find kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; }
#menu { display: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px;
  padding: 6px 10px; font: inherit; cursor: pointer; }

.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); }
aside { background: var(--side); border-right: 1px solid var(--line); padding: 10px 10px 30px; position: sticky;
  top: var(--top-h, 53px); height: calc(100vh - var(--top-h, 53px)); overflow-y: auto; }
nav h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); margin: 18px 8px 4px; font-weight: 600; }
nav .row { display: flex; align-items: center; border-radius: 6px; }
nav .row:hover { background: var(--line); }
nav .row.on { background: var(--accent-soft); }
nav .row.on > a { color: var(--accent); font-weight: 600; }
nav .row a { flex: 1; min-width: 0; padding: 5px 8px; color: var(--ink); font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
nav .row a:hover { text-decoration: none; }
nav .row a span { color: var(--soft); font-size: 12.5px; font-weight: 400; }
nav .row.none a { color: var(--soft); }
nav .row button { border: 0; background: none; color: var(--soft); cursor: pointer; padding: 5px 8px; font-size: 11px; border-radius: 6px; }
nav .items { margin: 1px 0 6px 10px; border-left: 1px solid var(--line); padding-left: 6px; }
nav .items a { display: block; padding: 3px 8px; border-radius: 6px; color: var(--ink); font-size: 13px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
nav .items a:hover { background: var(--line); text-decoration: none; }
nav .items a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav .items .more { color: var(--soft); font-style: italic; }

main { padding: 26px 36px 80px; max-width: 1080px; min-width: 0; outline: none; }
.crumb { color: var(--soft); font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; }
.crumb a { color: var(--soft); }
h1.title { font-size: 27px; line-height: 1.2; margin: 3px 0 6px; text-wrap: balance; font-weight: 700; }
.ident { font-family: var(--mono); font-size: 12.5px; color: var(--soft); overflow-wrap: anywhere; }
.lead { font-size: 16.5px; margin: 14px 0; max-width: 72ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; font-size: 12.5px; background: var(--panel);
  white-space: nowrap; }
.chip i { color: var(--soft); font-style: normal; }
.chip.gold { border-color: var(--gold); color: var(--gold); } .chip.silver { border-color: var(--silver); color: var(--silver); }
.chip.bronze { border-color: var(--bronze); color: var(--bronze); } .chip.ref { border-color: var(--ref); color: var(--ref); }
.chip.warn { border-color: var(--warn); color: var(--warn); }
h2.sec { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); margin: 34px 0 9px; font-weight: 600; }
h2.sec small { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 13px; margin-left: 6px; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 20px; margin: 0; }
.facts dt { color: var(--soft); } .facts dd { margin: 0; overflow-wrap: anywhere; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; margin: 10px 0; max-width: 80ch; }
.mind { margin: 0; padding-left: 18px; max-width: 80ch; } .mind li { margin: 3px 0; }
.empty { color: var(--soft); border: 1px dashed var(--line); border-radius: 10px; padding: 16px 18px; max-width: 72ch; }

.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.field label, .field legend { display: block; font-family: var(--mono); font-size: 13px; font-weight: 600; padding: 0; }
.field label em, .field legend em { font: 12px system-ui, sans-serif; color: var(--soft); font-style: normal; font-weight: 400; }
.field input[type=text], .field input[type=month], .field input[type=date] { width: 100%; margin-top: 4px; padding: 7px 9px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: 14px var(--mono); }
.field input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.field.bad input { border-color: var(--miss-ink); }
.field .hint { font-size: 12px; color: var(--soft); margin-top: 3px; }
.field.bad .hint { color: var(--miss-ink); }
fieldset.field { border: 0; margin: 0; padding: 0; min-width: 0; }
.field .pick { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 14px; }
.field .pick label { font: inherit; font-family: var(--mono); font-weight: 400; display: flex; gap: 5px; align-items: center; }

.codebox { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--code-bg); margin-top: 12px; }
.bar { display: flex; align-items: center; gap: 2px; padding: 5px 6px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.tab { border: 0; background: none; color: var(--soft); font: inherit; font-size: 13.5px; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.bar .gap { flex: 1; }
.bar label.opt { font-size: 12.5px; color: var(--soft); display: flex; align-items: center; gap: 5px; margin-right: 8px; }
button.copy { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 4px 12px;
  font: inherit; font-size: 13px; cursor: pointer; min-width: 74px; }
button.copy:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button.copy:disabled { opacity: .5; cursor: not-allowed; }
button.copy.done { background: var(--accent); border-color: var(--accent); color: var(--bg); }
pre { margin: 0; padding: 14px 16px; overflow-x: auto; font: 13.5px/1.6 var(--mono); tab-size: 4; }
.why { padding: 7px 16px; font-size: 12.5px; color: var(--soft); border-top: 1px solid var(--line); background: var(--panel); }
.why.stop { color: var(--miss-ink); }
.k { color: var(--kw); font-weight: 600; } .s { color: var(--str); } .n { color: var(--num); }
.c { color: var(--com); font-style: italic; } .j { color: var(--jin); }
mark { border-radius: 4px; padding: 1px 3px; }
mark.fill { background: var(--fill); color: var(--fill-ink); }
mark.miss { background: var(--miss); color: var(--miss-ink); }
mark.hit { background: var(--fill); color: var(--fill-ink); padding: 0 1px; }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; font-size: 13.5px; width: 100%; }
th { text-align: left; color: var(--soft); font-weight: 600; font-size: 12.5px; border-bottom: 1px solid var(--line); padding: 5px 14px 5px 0; white-space: nowrap; }
td { border-bottom: 1px solid var(--line); padding: 5px 14px 5px 0; vertical-align: top; }
td.m, th.m { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
td.r { text-align: right; font-variant-numeric: tabular-nums; }
td.null { color: var(--soft); font-style: italic; }
.case { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; }
.case p { margin: 0 0 8px; }
.ghost { border: 1px solid var(--line); background: none; color: var(--accent); border-radius: 6px; padding: 3px 10px; font: inherit;
  font-size: 13px; cursor: pointer; }
.ghost.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
details { margin: 8px 0; } summary { cursor: pointer; color: var(--soft); font-size: 13.5px; }

/* lists of things: an index page, the search, the cards of the first page */
.facets { display: flex; flex-wrap: wrap; gap: 6px 6px; align-items: center; margin: 14px 0 6px; font-size: 13px; color: var(--soft); }
.facets span { margin: 0 2px 0 10px; } .facets span:first-child { margin-left: 0; }
.list { border-top: 1px solid var(--line); margin-top: 10px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 10px 6px; border-bottom: 1px solid var(--line); color: var(--ink); }
.item:hover, .item.sel { background: var(--panel); text-decoration: none; }
.item.sel { box-shadow: inset 3px 0 0 var(--accent); }
.item b { font-weight: 600; } .item .ident { grid-column: 1; }
.item p { margin: 0; color: var(--soft); font-size: 13.5px; grid-column: 1; }
.item .chips { margin: 0; grid-column: 2; grid-row: 1 / span 3; align-content: start; justify-content: end; max-width: 300px; }
.item .kind { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-right: 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.tile h3 { margin: 0; font-size: 16px; } .tile p { margin: 0; color: var(--soft); font-size: 14px; flex: 1; }
.tile .go { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; font-weight: 600; }
.figure { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px; overflow: auto; max-height: 78vh; }
.figure svg { max-width: none; display: block; }
.figure.fit svg { width: 100%; height: auto; }
.figtools { display: flex; justify-content: flex-end; margin-bottom: 6px; }
.prose { max-width: 80ch; } .prose table { width: auto; margin: 8px 0; }
.prose h3, .prose h4 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); margin: 24px 0 6px; font-weight: 600; }
.prose pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; }
.words { max-width: 80ch; } .words dt { font-weight: 700; margin-top: 18px; font-size: 16px; } .words dd { margin: 4px 0 0; }
.words table { width: auto; margin-top: 6px; }
footer { color: var(--soft); font-size: 12.5px; margin-top: 56px; border-top: 1px solid var(--line); padding-top: 10px; max-width: 80ch; }
@media (max-width: 860px) {
  #menu { display: block; } .brand .names span { display: none; } .brand { min-width: 0; max-width: 34vw; }
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { display: none; position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  body.menu aside { display: block; }
  main { padding: 18px 16px 60px; }
  .item { grid-template-columns: minmax(0, 1fr); } .item .chips { grid-column: 1; grid-row: auto; justify-content: start; }
  .find kbd { display: none; }
  .toplinks { display: none; } nav .links { display: block; }
}
</style>
<style id="theme">/*STATERA-CATALOG-THEME*/</style>
</head>
<body>
<div class="head">
  <div class="notice" id="notice" hidden></div>
  <header class="top">
    <button id="menu" aria-label="Show the menu">Menu</button>
    <a class="brand" href="#/"><span class="names"><b id="repo"></b><span id="org"></span></span></a>
    <div class="find">
      <input id="search" type="search" placeholder="Search tables, columns, queries, rules, code…" aria-label="Search the catalog" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
    <div class="toplinks" id="toplinks"></div>
  </header>
</div>
<div class="app">
  <aside><nav id="nav" aria-label="Catalog"></nav></aside>
  <main id="main" tabindex="-1">
    <div id="boot" class="empty">
      <p><b>The catalog is not drawn yet.</b> If this stays here, the script of the page did not run: open the file in a
      browser (Chrome, Firefox, Safari, Edge) instead of a preview pane. <code>statera docs --open</code> does that.</p>
    </div>
  </main>
</div>
<script>
// A page that cannot draw itself says why, instead of staying empty (plain old JavaScript: it must run anywhere).
window.addEventListener("error", function (event) {
  var main = document.getElementById("main"), data = document.getElementById("data");
  if (!main || !document.getElementById("boot")) return;  // something is drawn already: leave it
  var template = !data || /^\s*\/\*/.test(data.textContent);
  main.innerHTML = template
    ? '<h1 class="title">This is the template of the catalog page</h1>' +
      '<p class="lead">It is the file inside the framework, with no catalog in it. The page of a repository is made ' +
      'by a command, run in any folder of that repository:</p>' +
      '<div class="codebox"><pre>statera docs --open    # writes target/catalog.html and opens it in the browser\n' +
      'statera docs --page    # only writes it</pre></div>'
    : '<h1 class="title">The page could not be drawn</h1><p class="lead">Its script stopped with an error. Make the ' +
      'page again (<code>statera docs --page</code>); if it happens again, it is a defect of Statera: report it with ' +
      'the message below and the browser used.</p><div class="codebox"><pre id="why"></pre></div>';
  var why = document.getElementById("why");
  if (why) why.textContent = (event.message || "error") + (event.lineno ? " (line " + event.lineno + ")" : "");
});
</script>
<script type="application/json" id="data">/*STATERA-CATALOG-DATA*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const OPEN = "", CLOSE = "", MISS = "", MISS_END = "";
const main = document.getElementById("main"), nav = document.getElementById("nav"), search = document.getElementById("search");
const TH = D.theme || {}, NAME = TH.name || D.project.name;  // the institution's own name, logo, notice and links

// ---- small helpers ---------------------------------------------------------------------------------
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fold = t => String(t ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const href = (kind, id) => `#/${kind}${id != null && id !== "" ? "/" + encodeURIComponent(id) : ""}`;
const link = (kind, id, text) => `<a href="${href(kind, id)}">${esc(text ?? id)}</a>`;
const chip = (label, value, cls = "") => value || value === 0 ? `<span class="chip ${cls}">${label ? `<i>${esc(label)}</i> ` : ""}${esc(value)}</span>` : "";
const facts = rows => { const shown = rows.filter(r => r && r[1]);
  return shown.length ? `<dl class="facts">${shown.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>` : ""; };
const sec = (title, note = "") => `<h2 class="sec">${esc(title)}${note ? `<small>${note}</small>` : ""}</h2>`;
const index = (list, key) => Object.fromEntries(list.map(x => [x[key], x]));
const Q = index(D.queries, "slug"), T = index(D.tables, "name"), P = index(D.products, "name"), R = index(D.rules, "id"),
  M = index(D.metrics, "name"), C = index(D.code, "path"), RC = index(D.recipes, "path");
const stem = name => name.replace(/\.[^.]+$/, "");
const tableLink = n => T[n] ? link("tables", n) : `<span class="mono">${esc(n)}</span>`;
const productLink = n => P[n] ? link("products", n, P[n].title) : esc(n);
const ruleLink = n => R[n] ? link("rules", n, `${n} ${R[n].title}`) : esc(n);
const links = (list, one) => list.map(one).join("<br>");
const LANGUAGE = {sql: "SQL", python: "Python", r: "R", spss: "SPSS / PSPP", sh: "Terminal"};
const lines = text => text.join("\n");
const tick = text => esc(text).replace(/`([^`]+)`/g, "<code>$1</code>");  // prose from the repository: `code` as code

// what belongs together, worked out once from what each thing declares
const queriesOf = t => D.queries.filter(q => q.bases.includes(t.name));
const metricsOf = t => D.metrics.filter(m => m.sources.some(s => s.table === t.name));
const modelOf = t => t.model || t.name.split(".").pop();
const rulesOfTable = t => D.rules.filter(r => r.model === modelOf(t));
const codeOfTable = t => D.code.filter(c => c.table === t.name);
const codeOfRule = r => D.code.filter(c => c.role === "model" && stem(c.name) === r.model);
const tableOfContract = id => D.tables.find(t => t.contract === id);

// ---- colouring: one small tokenizer for the languages a repository holds ---------------------------
const WORDS = {
  sql: "select from where group by order having join left right inner outer full cross on as and or not in is null case when then else end with union all distinct limit offset over partition qualify between like asc desc cast count sum avg min max median row_number coalesce using exists interval true false",
  python: "def return import from as if elif else for while in not and or is None True False with try except finally raise class lambda pass yield",
  r: "function if else for while in return library require TRUE FALSE NULL NA next break",
  spss: "get file data aggregate outfile break compute formats sort cases by save select if execute recode into variables type delimiters qualifier firstcase frequencies descriptives list match files table",
  sh: "",
};
const COMMENT = {sql: "--[^\\n]*|/\\*[\\s\\S]*?\\*/", python: "#[^\\n]*", r: "#[^\\n]*", spss: "^[ \\t]*\\*[^\\n]*", sh: "#[^\\n]*"};
function paint(text, lang) {
  lang = WORDS[lang] == null ? "sh" : lang;
  const foldCase = lang === "sql" || lang === "spss", words = new Set(WORDS[lang].split(" "));
  const re = new RegExp(`(${COMMENT[lang]})|('(?:[^'\\n]|'')*'|"(?:[^"\\\\\\n]|\\\\.)*")|(\\b\\d+(?:\\.\\d+)?\\b)|([A-Za-z_][A-Za-z0-9_]*)`, "gm");

    .replace(new RegExp(`${OPEN}([^${CLOSE}]*)${CLOSE}`, "g"), `<mark class="fill" title="a parameter's value">$1</mark>`)
    .replace(new RegExp(`${MISS}([^${MISS_END}]*)${MISS_END}`, "g"), `<mark class="miss" title="not filled in">$1</mark>`);

  while ((m = re.exec(text))) {

    if (com) out += `<span class="c">${plain(tok)}</span>`;
    else if (str) out += `<span class="s">${plain(tok)}</span>`;
    else if (num) out += `<span class="n">${tok}</span>`;
    else out += words.has(foldCase ? word.toLowerCase() : word) ? `<span class="k">${tok}</span>` : esc(tok);

function viewConcepts() {
  const c = D.project.conventions;
  main.innerHTML = `<div class="crumb">Reference</div><h1 class="title">The words used here</h1>
    <p class="lead">What one needs to know to read these data right. Each term is used the same way in every product.</p>
    <dl class="words">
    <dt id="product">Product</dt><dd>A statistic with an owner: its tables, the contract of each one, the rules that make its numbers and the process that produces it. A <b>published</b> product releases editions. An <b>internal</b> product holds what the others are made from (often personal data) and is read only by who it authorizes.</dd>
    <dt id="layers">Layers</dt><dd>Where a table stands between the source and the release.
      <table><tr><td><span class="chip bronze">bronze</span></td><td>As it arrived from the source system, batch by batch. Queries do not read it.</td></tr>
      <tr><td><span class="chip silver">silver</span></td><td>Cleaned and standardized, still row by row.</td></tr>
      <tr><td><span class="chip gold">gold</span></td><td>The tables a product releases: what most questions should start from.</td></tr>
      <tr><td><span class="chip ref">ref</span></td><td>Reference tables shared by every product (territories, classifications).</td></tr></table></dd>
    <dt id="edition">Edition, reference period and cut-off date</dt><dd>An edition is what a product publishes for one reference period (<code>${esc(c.period_column)}</code>, text <code>YYYY-MM</code>). It is computed from the data as it stood on its <b>cut-off date</b> (<code>${esc(c.cut_date_column)}</code>). Records arrive late, so the same period can show a different number in a later edition: always say which edition, or which cut, a number comes from. A published edition is never changed; a correction is a new version of it.</dd>
    <dt id="reading">Three ways to read</dt><dd><b>Current</b>: the tables as they are now (<code>cat.table(…)</code>). <b>Published edition</b>: exactly what was released, with its hash checked (<code>cat.edition(product, period)</code>). <b>Cut-off date</b>: an internal product as it was at one cut (<code>cat.table(…, cut_date=…)</code>).</dd>
    <dt id="classification">Classification</dt><dd>Every table and every query result says how far it may go, in three words.
      <table><tr><td><b>sharing</b></td><td>broad · restricted · specific</td></tr><tr><td><b>nature</b></td><td>aggregated · deidentified · personal · sensitive-personal</td></tr>
      <tr><td><b>secrecy</b></td><td>none · statistical · tax · other</td></tr></table>
      Only what is broad, aggregated or deidentified, and under no secrecy (or statistical secrecy with disclosure control applied) is published openly.</dd>
    <dt id="control">Disclosure control</dt><dd>What keeps a small group from being identified in a result, such as suppressing cells with few cases. A cataloged query applies the control its classification declares before the result is shown or written. SQL of your own does not: aggregate and apply it before sharing anything.</dd>
    <dt id="query">Query, metric, recipe</dt><dd>A <b>recurring query</b> is a calculation that is asked for again and again: parameterized, tested, with an owner and a status (exploratory → cataloged → certified → deprecated). A <b>metric</b> is defined once, with the dimensions it may be broken down by. A <b>recipe</b> is an example to start from. A number that will be shared belongs in a cataloged query, not in SQL written for the occasion.</dd>
    <dt id="rule">Business rule</dt><dd>What a number means, in words, with worked cases. The cases are also the tests the machine runs: the rule people read and the one that is executed cannot drift apart.</dd>
    <dt id="contract">Contract</dt><dd>What a table promises: what a row is, each column and its type, the classification, the quality checks. The catalog of tables on this page is read from the contracts.</dd>
    </dl>`;
}

    ${published.length ? sec("Where each product is", `as of ${esc(D.project.generated)}`) + `<div class="scroll"><table><tr><th>Product</th><th>Latest edition</th><th>Cut-off date</th><th>Next by the calendar</th></tr>${published.map(p => {
      const e = p.series && p.series.editions[0], x = p.calendar && p.calendar.next;
      return `<tr><td>${link("products", p.name, p.title)}</td><td class="m">${e ? esc(e.period) : p.internal ? `<span class="ident">internal: it releases cuts</span>` : "—"}</td><td class="m">${e ? esc(e.cut_date) : ""}</td>
        <td class="m">${x ? `${esc(x.edition)} <span class="ident">${esc(x.state)}${x.release ? ", release " + esc(x.release) : ""}</span>` : "—"}</td></tr>`; }).join("")}</table></div>` : ""}
    ${sec("First time here")}<div id="code"></div>
    ${n("queries") ? sec("Recurring queries") + `<div class="list">${D.queries.slice(0, 6).map(q => item("queries", q)).join("")}</div>${n("queries") > 6 ? `<p>${link("queries", "", `all ${n("queries")} queries`)}</p>` : ""}` : ""}`;
  codebox(main.querySelector("#code"), firstSteps());
}

// ---- search ------------------------------------------------------------------------------------------
const INDEX = [
  ...Object.entries(KINDS).flatMap(([kind, K]) => K.list.map(x => ({kind, x, label: K.one, title: fold(K.title(x)), ident: fold(x[K.key] + " " + K.ident(x)), text: fold(K.text(x)), words: fold(K.words(x))}))),
  ...Object.entries(PAGES).map(([page, p]) => ({page, label: "page", name: p.title, title: fold(p.title), ident: "", text: "", words: fold(p.words)})),
];
function found(query) {
  const terms = fold(query).split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  const out = [];
  for (const e of INDEX) {
    let score = 0;
    for (const t of terms) {
      const s = e.title.startsWith(t) ? 100 : e.title.includes(t) ? 60 : e.ident.includes(t) ? 40 : e.text.includes(t) ? 20 : e.words.includes(t) ? 10 : 0;
      if (!s) { score = 0; break; }
      score += s;
    }
    if (score) out.push([score, e]);
  }
  const rank = e => e.page ? 99 : Object.keys(KINDS).indexOf(e.kind);  // of two equal matches, what can be asked comes first
  return out.sort((a, b) => b[0] - a[0] || rank(a[1]) - rank(b[1]) || a[1].title.localeCompare(b[1].title)).map(x => x[1]);
}
/** Why a result that matched only deep in its text is there: the words around the first match. */
function excerpt(e, terms) {
  if (terms.every(t => e.title.includes(t) || e.ident.includes(t) || e.text.includes(t))) return "";
  const raw = KINDS[e.kind].words(e.x).replace(/\s+/g, " "), folded = fold(raw), t = terms.find(t => folded.includes(t)), at = folded.indexOf(t);
  if (at < 0 || folded.length !== raw.length) return "";
  return (at > 40 ? "… " : "") + raw.slice(Math.max(0, at - 40), at + 80) + (at + 80 < raw.length ? " …" : "");
}
function viewSearch(query) {
  const results = found(query), terms = fold(query).split(/\s+/).filter(Boolean);
  const mark = text => {
    const raw = String(text ?? ""), folded = fold(raw);
    if (folded.length !== raw.length) return esc(raw);
    const hit = new Array(raw.length).fill(false);
    for (const t of terms) for (let at = folded.indexOf(t); at >= 0; at = folded.indexOf(t, at + t.length)) hit.fill(true, at, at + t.length);
    let out = "", i = 0;
    while (i < raw.length) { let j = i; while (j < raw.length && hit[j] === hit[i]) j++;
      out += hit[i] ? `<mark class="hit">${esc(raw.slice(i, j))}</mark>` : esc(raw.slice(i, j)); i = j; }
    return out;
  };
  main.innerHTML = `<div class="crumb">Search</div><h1 class="title">${results.length} result${results.length === 1 ? "" : "s"} for “${esc(query)}”</h1>
    <div class="ident">↑ ↓ to move, Enter to open, Esc to leave the search</div>
    ${results.length ? `<div class="list">${results.slice(0, 80).map(e => e.page
      ? `<a class="item" href="${href(e.page)}"><div><span class="kind">page</span><b>${mark(e.name)}</b></div></a>`
      : item(e.kind, e.x, e.label, mark).replace("</a>", () => { const x = excerpt(e, terms); return x ? `<p class="ident">${mark(x)}</p></a>` : "</a>"; })).join("")}</div>
      ${results.length > 80 ? `<p class="ident">The first 80 are shown: add a word to narrow it.</p>` : ""}`
    : `<p class="empty">Nothing in the catalog has every one of these words. Try fewer words, a column name, or the code of a rule or a query.</p>`}`;
  const first = main.querySelector(".item"); if (first) first.classList.add("sel");
}

// ---- navigation --------------------------------------------------------------------------------------
const opened = {};  // the kinds whose items are listed in the menu
function drawNav(kind, id) {
  const here = (k, i = "") => kind === k && (i === "" ? !id : id === i);
  nav.innerHTML = `<div class="row${kind === "" ? " on" : ""}" style="margin-top:8px"><a href="#/">Start here</a></div>` + GROUPS.map(([group, title]) => `<h2>${esc(title)}</h2>` +
    [...Object.entries(KINDS).filter(([, K]) => K.group === group).map(([k, K]) => {
      const open = opened[k] ?? (kind === k), max = 40;
      return `<div class="row${here(k) ? " on" : ""}${K.list.length ? "" : " none"}"><a href="${href(k)}">${esc(K.many)} <span>${K.list.length}</span></a>${K.list.length
        ? `<button data-open="${k}" aria-expanded="${open}" aria-label="${open ? "Hide" : "List"} the ${esc(K.many.toLowerCase())}">${open ? "▾" : "▸"}</button>` : ""}</div>` +
        (open && K.list.length ? `<div class="items">${K.list.slice(0, max).map(x => `<a href="${href(k, x[K.key])}" class="${here(k, x[K.key]) ? "on" : ""}" title="${esc(K.title(x))}">${esc(K.title(x))}</a>`).join("")}
          ${K.list.length > max ? `<a class="more" href="${href(k)}">all ${K.list.length}…</a>` : ""}</div>` : ""); }),
     ...Object.entries(PAGES).filter(([, p]) => p.group === group).map(([k, p]) => `<div class="row${kind === k ? " on" : ""}"><a href="${href(k)}">${esc(p.title)}</a></div>`)].join("")).join("");
  if (LINKS) nav.insertAdjacentHTML("beforeend", `<div class="links">${LINKS}</div>`);
  nav.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { opened[b.dataset.open] = b.getAttribute("aria-expanded") !== "true"; drawNav(kind, id); });
  const on = nav.querySelector(".items a.on"); if (on && on.scrollIntoView) on.scrollIntoView({block: "nearest"});
}
function route() {
  const [path, qs] = location.hash.slice(2).split("?"), [kind, raw] = path.split("/"), params = new URLSearchParams(qs || "");
  let id = ""; try { id = decodeURIComponent(raw || ""); } catch { id = raw || ""; }
  const K = KINDS[kind], thing = K && id ? K.list.find(x => String(x[K.key]) === id) : null;
  document.body.classList.remove("menu");
  if (kind === "search") { if (search.value !== params.get("q")) search.value = params.get("q") || ""; viewSearch(params.get("q") || ""); }
  else if (thing) K.view(thing, params);
  else if (K) viewIndex(kind);
  else if (PAGES[kind]) PAGES[kind].view();
  else viewHome();
  if (kind !== "search") search.value = "";
  const title = thing ? K.title(thing) : K ? K.many : PAGES[kind] ? PAGES[kind].title : "";
  document.title = (title ? title + " · " : "") + NAME;
  main.insertAdjacentHTML("beforeend", `<footer>${TH.footer ? esc(TH.footer) + "<br>" : ""}A picture of the repository on ${esc(D.project.generated)}, made by Statera ${esc(D.project.statera)} (<code>statera docs --page</code> makes it again).
    It holds metadata and code only: the data stays in the engine, and the cases shown under a rule or a query are synthetic.</footer>`);
  drawNav(thing || K || PAGES[kind] || kind === "search" ? kind : "", thing ? id : "");
  if (kind !== "search") window.scrollTo(0, 0);
}
let before = "#/";  // where one was when the search began
search.addEventListener("input", () => {
  const q = search.value.trim();
  if (!location.hash.startsWith("#/search")) before = location.hash || "#/";
  history.replaceState(null, "", q ? `#/search?q=${encodeURIComponent(search.value)}` : before);
  if (q) { viewSearch(search.value); drawNav("search", ""); } else route();
});
search.addEventListener("keydown", e => {
  const items = [...main.querySelectorAll(".list .item")], at = items.findIndex(i => i.classList.contains("sel"));
  if (e.key === "Escape") { search.value = ""; history.replaceState(null, "", before); route(); search.blur(); }
  else if (e.key === "Enter" && items[at]) { e.preventDefault(); location.hash = items[at].getAttribute("href"); search.blur(); }
  else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && items.length) { e.preventDefault();
    const next = Math.max(0, Math.min(items.length - 1, at + (e.key === "ArrowDown" ? 1 : -1)));
    items.forEach((i, n) => i.classList.toggle("sel", n === next)); items[next].scrollIntoView({block: "nearest"}); }
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !e.metaKey && !e.ctrlKey) { e.preventDefault(); search.focus(); search.select(); }
});
document.getElementById("menu").onclick = () => document.body.classList.toggle("menu");
document.getElementById("repo").textContent = NAME;
document.getElementById("org").textContent = [D.project.organization, D.project.synthetic ? "synthetic data" : ""].filter(x => x && x !== NAME).join(" · ");
if (TH.logo) {
  const image = (src, cls) => `<img class="logo ${cls}" src="${esc(src)}" alt="${esc(TH.logo.alt)}">`;
  document.querySelector(".brand").insertAdjacentHTML("afterbegin", image(TH.logo.src, TH.logo.dark ? "for-light" : "") + (TH.logo.dark ? image(TH.logo.dark, "for-dark") : ""));
  if (TH.logo.alone) document.querySelector(".brand .names").hidden = true;
}
if (TH.notice) { const notice = document.getElementById("notice"); notice.textContent = TH.notice; notice.hidden = false; }
const LINKS = (TH.links || []).map(l => `<a href="${esc(l.url)}"${/^https?:/.test(l.url) ? ' rel="noreferrer"' : ""}>${esc(l.label)}</a>`).join("");
document.getElementById("toplinks").innerHTML = LINKS;
// the menu stays right under the bar, however tall the theme's logo and notice make it
const head = document.querySelector(".head"), measure = () => document.documentElement.style.setProperty("--top-h", head.offsetHeight + "px");
measure(); if (window.ResizeObserver) new ResizeObserver(measure).observe(head); else window.addEventListener("resize", measure);
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
