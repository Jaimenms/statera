# MINIMAL EXAMPLE data repository for the statera standard: an internal source product (foo),
# a dissemination product (bar) and a reference table (uf). All fictitious, with SYNTHETIC DATA.
# Same layout that `statera init` creates: content/ (here), publications/ and .github/ in the folder above.

[project]
name = "statera-foo-bar"
organization = "Foo Bar (minimal example)"
acronym = "foo-bar"
namespace = "org.example.foo-bar"
specification = "0.1"
required_version = "~=0.7.0"         # Statera versions this repository accepts
repository_root = ".."             # repository root (where .github/, publications/, docs/ live)
synthetic = true

[engine]
type = "duckdb"
path = "dbt/data/warehouse.duckdb"

[consumption]
# Shared engine for those outside the data team (statera.consume.connection). The example has none: it reads
# the local engine that `statera demo` builds.
# engine = "https://data.example.org/foo-bar/warehouse.duckdb"

[dbt]
folder = "dbt"
project = "statera_foo_bar"
profile = "statera_foo_bar"

[registry]
editions = "../publications"

[openlineage]
namespace = "org.example.foo-bar"

[demo]
# Two editions of bar; each first releases the foo cut it needs. The synthetic data comes from the products'
# SyntheticSource classes (products/foo/3-build/synthetic.py), run by `statera synthetic`.
editions = [
  { product = "bar", period = "2026-01" },
  { product = "bar", period = "2026-02" },
]
