# ODCS v3.1 contract — official reference table (IBGE), consumed by version.
# Local copy in this demo: in production, the authority publishes it and organizations consume it by version.
apiVersion: v3.1.0
kind: DataContract
id: ref-uf
name: Federative Units
version: 1.0.0
status: active
domain: references
tags: [ref]
description:
  purpose: "Federative Units (UFs) and major regions, with IBGE codes."
  usage: "Geographic aggregation for all products."
  limitations: "Local copy; the official source is IBGE."
servers:
  - {server: warehouse-local, type: duckdb, database: dbt/data/warehouse.duckdb, schema: ref, environment: dev}
schema:
  - name: ref_uf
    physicalName: ref.ref_uf
    physicalType: table
    logicalType: object
    properties:
      - {name: uf_id, logicalType: integer, physicalType: "INTEGER", required: true, primaryKey: true, primaryKeyPosition: 1, classification: broad}
      - {name: uf_abbr, logicalType: string, physicalType: "VARCHAR", required: true, classification: broad}
      - {name: uf_name, logicalType: string, physicalType: "VARCHAR", required: true, classification: broad}
      - {name: region_id, logicalType: integer, physicalType: "INTEGER", required: true, classification: broad}
      - {name: region, logicalType: string, physicalType: "VARCHAR", required: true, classification: broad}
    quality:
      - {id: rows_present, type: library, metric: rowCount, mustBe: 27}
team:
  name: Curation
  members:
    - {username: "role:curation", role: owner}
customProperties:
  - {property: layer, value: ref}
  - {property: urn, value: org.example.foo-bar.uf.ref.ref-uf}
  - {property: dbtSeed, value: ref_uf}
  - {property: authority, value: "IBGE"}
  - {property: temporality, value: stable}
  - property: classification
    value: {sharing: broad, nature: aggregated, secrecy: none}
contractCreatedTs: "2026-11-13T00:00:00Z"
