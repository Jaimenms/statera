# Source-aligned INTERNAL product (ODPS v1.0): extracts the Foo System in batches and releases CUTS.
apiVersion: v1.0.0
kind: DataProduct
id: foo
name: Foo — Foo System records (extraction)
version: 1.0.0
status: active
domain: foo
tenant: Foo Bar (minimal example)
description:
  purpose: Incremental extraction of Foo System records, one per request received.
  usage: Input to the bar dissemination product, always through a cut.
  limitations: Records arrive late; the same reference month changes between cuts. SYNTHETIC DATA.
tags: [internal, source]
customProperties:
  - {property: alignment, value: source}
  - {property: visibility, value: internal}
  - {property: urn, value: org.example.foo-bar.foo}
  - {property: process, value: 2-design/processes/to-be.yaml}
  - {property: conformanceLevel, value: 3}
  - {property: sourceSystems, value: [Foo System]}
  - property: authorizedConsumers
    value:
      - {product: bar, purpose: "monthly statistics of records and value by UF"}
      - {product: baz, purpose: "mean value by UF from the legacy SPSS script"}
outputPorts:
  - {name: records, description: Foo System records, type: table, version: 1.0.0, contractId: bronze-foo-records}
team:
  name: Data team
  members:
    - {username: "role:data-team", role: owner}
productCreatedTs: "2026-11-14T00:00:00Z"
