# Process in YAML, mirror of the BPMN 2.0, and run plan: `statera run --product foo --cut-date YYYY-MM-DD`.
id: Process_Foo_ToBe
name: Foo System extraction (TO-BE)

lanes:
  - {id: Lane_Data, name: Data team (statera run), role: data-team}

elements:
  - {id: Start_Cut, type: startEvent, name: Cut-off date requested by consumers, lane: Lane_Data, event: timer}
  - id: Task_Extract
    type: serviceTask
    name: Extract the increment received since the last load
    lane: Lane_Data
    outputs: [Store_Bronze]
    statera: {type: automatic, gsbpm: '4.3', durationMin: 1, implementation: 'py:statera.collect.step'}
  - id: Task_Validate
    type: serviceTask
    name: Check the bronze contract at the cut
    lane: Lane_Data
    statera: {type: automatic, gsbpm: '4.4', durationMin: 1, implementation: 'py:statera.analyse.step'}
  - {id: Gateway_Ok, type: exclusiveGateway, name: 'Load OK?', lane: Lane_Data}
  - id: Task_MarkCut
    type: serviceTask
    name: Mark the cut and notify consumers
    lane: Lane_Data
    statera: {type: automatic, gsbpm: '7.3', durationMin: 1, implementation: 'py:statera.disseminate.mark_cut'}
  - id: Task_Investigate
    type: userTask
    name: Investigate the load with the Foo System
    lane: Lane_Data
    statera: {type: manual, gsbpm: '4.3', durationMin: 60, exception: true}
  - {id: End_Cut, type: endEvent, name: Cut available, lane: Lane_Data}

data:
  - {id: Store_Bronze, type: dataStoreReference, name: Bronze (immutable batches), asset: bronze-foo-records}

flows:
  - {id: Flow_1, from: Start_Cut, to: Task_Extract}
  - {id: Flow_2, from: Task_Extract, to: Task_Validate}
  - {id: Flow_3, from: Task_Validate, to: Gateway_Ok}
  - {id: Flow_4, from: Gateway_Ok, to: Task_MarkCut, name: 'yes', condition: ok}
  - {id: Flow_5, from: Gateway_Ok, to: Task_Investigate, name: 'no', condition: failed}
  - {id: Flow_6, from: Task_Investigate, to: Task_Extract}
  - {id: Flow_7, from: Task_MarkCut, to: End_Cut}
