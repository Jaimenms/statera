# Release calendar (illustrative). The cut-off date defines what goes into each edition.
product: bar
frequency: monthly
cut_date_rule: 10th day of the month after the reference month
release_rule: 15th day of the month after the reference month
editions:
  - {period: "2026-01", cut_date: "2026-02-10", release: "2026-02-15"}
  - {period: "2026-02", cut_date: "2026-03-10", release: "2026-03-15"}
