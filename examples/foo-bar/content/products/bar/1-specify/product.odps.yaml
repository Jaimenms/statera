# Produto de DIVULGAÇÃO (ODPS v1.0): registros e valor por UF e mês, a partir do corte de foo.
apiVersion: v1.0.0
kind: DataProduct
id: bar
name: Bar — registros e valor por UF
version: 1.0.0
