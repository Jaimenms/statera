# Process in YAML, mirror of the BPMN 2.0, and run plan: `statera run --product bar --period YYYY-MM`.
id: Process_Bar
name: Bar monthly production

lanes:
  - {id: Lane_Pipeline, name: Pipeline (statera run), role: data-team}
  - {id: Lane_Team, name: Bar technical team, role: bar-team}

elements:
  - {id: Start_CutDate, type: startEvent, name: Calendar cut-off date, lane: Lane_Pipeline, event: timer}
  - id: Event_Cut
    type: intermediateCatchEvent
    name: foo cut available
    lane: Lane_Pipeline
    event: message
    statera: {awaits: PinCut}
  - id: Task_Transform
    type: serviceTask
    name: Compute the product tables (dbt build)
    lane: Lane_Pipeline
    statera:
      type: automatic
      gsbpm: 5.3-5.7
      durationMin: 1
      implementation: DbtBuild
      models: [stg_foo__records, int_bar__records, bar_uf_monthly, bar_uf_monthly_change]
  - id: Task_Controls
    type: serviceTask
    name: Check contracts and controls across editions
    lane: Lane_Pipeline
    statera: {type: automatic, gsbpm: '6.2', durationMin: 1, implementation: Gate, checks: [CK-01, CK-02]}
  - {id: Gateway_Controls, type: exclusiveGateway, name: 'Controls OK?', lane: Lane_Pipeline}
  - id: Task_Package
    type: serviceTask
    name: Generate xlsx, summary and Data Package
    lane: Lane_Pipeline
    statera: {type: automatic, gsbpm: 6.4;7.2, durationMin: 1, implementation: Package}
  - id: Task_Investigate
    type: userTask
    name: Investigate the failure
    lane: Lane_Team
    statera: {type: manual, gsbpm: '5.3', durationMin: 60, exception: true}
  - id: Task_Approve
    type: userTask
    name: Review and approve the release
    lane: Lane_Team
    statera: {type: manual, gsbpm: '6.5', durationMin: 30}
  - {id: Gateway_Approved, type: exclusiveGateway, name: 'Approved?', lane: Lane_Team}
  - id: Task_Publish
    type: userTask
    name: Publish the package
    lane: Lane_Team
    statera: {type: semi-automatic, gsbpm: '7.3', durationMin: 10, implementation: Publish}
  - {id: End_Published, type: endEvent, name: Edition published, lane: Lane_Team}

flows:
  - {id: Flow_1, from: Start_CutDate, to: Event_Cut}
  - {id: Flow_2, from: Event_Cut, to: Task_Transform}
  - {id: Flow_3, from: Task_Transform, to: Task_Controls}
  - {id: Flow_4, from: Task_Controls, to: Gateway_Controls}
  - {id: Flow_5, from: Gateway_Controls, to: Task_Package, name: 'yes', condition: ok}
  - {id: Flow_6, from: Gateway_Controls, to: Task_Investigate, name: 'no', condition: failed}
  - {id: Flow_7, from: Task_Investigate, to: Task_Transform}
  - {id: Flow_8, from: Task_Package, to: Task_Approve}
  - {id: Flow_9, from: Task_Approve, to: Gateway_Approved}
  - {id: Flow_10, from: Gateway_Approved, to: Task_Publish, name: 'yes', condition: approved}
  - {id: Flow_11, from: Gateway_Approved, to: Task_Approve, name: 'no', condition: rejected}
  - {id: Flow_12, from: Task_Publish, to: End_Published}
