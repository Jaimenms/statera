# Edition controls (GSBPM 6.2). Framework type; the product chooses table, columns and thresholds.
controls:
  - id: CK-01
    name: Revision of already released reference months
    type: revision-between-editions
    port: by-uf
    key: [period, uf_abbr]
    measures: [records]
    relative_base: records
    warning_threshold: 0.10
    error_threshold: 0.60
