# Controles da edição (GSBPM 6.2). Tipo da plataforma; o produto escolhe tabela, colunas e limites.
controls:
  - id: CK-01
    name: Revisão de competências já divulgadas
    type: revision-between-editions
    port: por-uf
    key: [competencia, sigla_uf]
    measures: [registros]
    relative_base: registros
    warning_threshold: 0.10
    error_threshold: 0.60
