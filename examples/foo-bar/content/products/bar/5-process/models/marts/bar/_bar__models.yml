version: 2

models:
  - name: bar_uf_monthly
    description: Records and value by UF and event reference month (BR-BAR-001).
    columns:
      - name: period
        data_tests: [not_null]
      - name: records
        data_tests: [not_null]

  - name: bar_uf_monthly_change
    description: Month-over-month change in records by UF (BR-BAR-002), in pandas.
    columns:
      - name: period
        data_tests: [not_null]

exposures:
  - name: bar_monthly_release
    label: Bar — monthly release (spreadsheet, CSV, summary and Data Package)
    type: analysis
    maturity: medium
    description: Package published at each edition.
    depends_on:
      - ref('bar_uf_monthly')
      - ref('bar_uf_monthly_change')
    owner:
      name: Bar technical team (role)
    meta:
      product: bar
      sharing: broad
      implementation: Package
