# Contrato ODCS v3.1 — gold de bar calculada por modelo Python (pandas). DADOS SINTÉTICOS.
apiVersion: v3.1.0
kind: DataContract
id: gold-bar-variacao-uf-mensal
name: Bar — variação de registros por UF sobre o mês anterior
version: 1.0.0
status: active
domain: foo
dataProduct: bar
tags: [gold, bar, divulgacao, python]
description:
  purpose: Variação percentual de registros de cada UF em relação à competência anterior (RN-BAR-002).
  usage: Tabela de divulgação mensal; calculada em pandas (modelo Python do dbt).
  limitations: Vazia na primeira competência de cada UF. DADOS SINTÉTICOS.
servers:
  - {server: warehouse-local, type: duckdb, database: dbt/data/warehouse.duckdb, schema: gold, environment: dev}
schema:
  - name: bar_variacao_uf_mensal
    physicalName: gold.bar_variacao_uf_mensal
    physicalType: table
    logicalType: object
    dataGranularityDescription: Uma linha por competência e UF com registros
    properties:
      - {name: competencia, logicalType: string, physicalType: VARCHAR, required: true, primaryKey: true, primaryKeyPosition: 1, classification: broad}
      - {name: sigla_uf, logicalType: string, physicalType: VARCHAR, required: true, primaryKey: true, primaryKeyPosition: 2, classification: broad}
      - {name: data_corte, logicalType: date, physicalType: DATE, required: true, classification: broad}
      - {name: registros, logicalType: integer, physicalType: BIGINT, required: true, classification: broad}
      - {name: registros_mes_anterior, logicalType: number, physicalType: DOUBLE, classification: broad}
      - {name: variacao_pct, logicalType: number, physicalType: DOUBLE, classification: broad}
    quality:
      - {id: linhas_presentes, type: library, metric: rowCount, mustBeGreaterThan: 0}
team:
  name: Equipe técnica de Bar
  members:
    - {username: "papel:equipe-bar", role: owner}
customProperties:
  - {property: layer, value: gold}
  - {property: urn, value: br.gov.foo-bar.bar.gold.bar-variacao-uf-mensal}
  - {property: dbtModel, value: bar_variacao_uf_mensal}
  - property: classification
    value: {sharing: broad, nature: aggregated, secrecy: none}
contractCreatedTs: "2026-11-14T00:00:00Z"
