# ODCS v3.1 contract — bar dissemination gold. SYNTHETIC DATA.
apiVersion: v3.1.0
kind: DataContract
id: gold-bar-uf-monthly
name: Bar — records and value by UF and reference month
version: 1.0.0
status: active
domain: foo
dataProduct: bar
tags: [gold, bar, dissemination]
description:
  purpose: Records and value by UF and event reference month (BR-BAR-001).
  usage: Monthly release table; always with the cut-off date.
  limitations: Recent reference months change between editions. SYNTHETIC DATA.
servers:
  - {server: warehouse-local, type: duckdb, database: dbt/data/warehouse.duckdb, schema: gold, environment: dev}
schema:
  - name: bar_uf_monthly
    physicalName: gold.bar_uf_monthly
    physicalType: table
    logicalType: object
    dataGranularityDescription: One row per reference month and UF with records
    properties:
      - {name: period, logicalType: string, physicalType: VARCHAR, required: true, primaryKey: true, primaryKeyPosition: 1, classification: broad}
      - {name: uf_abbr, logicalType: string, physicalType: VARCHAR, required: true, primaryKey: true, primaryKeyPosition: 2, classification: broad}
      - {name: uf_name, logicalType: string, physicalType: VARCHAR, classification: broad}
      - {name: cut_date, logicalType: date, physicalType: DATE, required: true, classification: broad}
      - {name: records, logicalType: integer, physicalType: BIGINT, required: true, classification: broad}
      - {name: total_value, logicalType: number, physicalType: "DECIMAL(14,2)", required: true, classification: broad}
      - {name: mean_value, logicalType: number, physicalType: "DECIMAL(12,2)", classification: broad}
    quality:
      - {id: rows_present, type: library, metric: rowCount, mustBeGreaterThan: 0}
team:
  name: Bar technical team
  members:
    - {username: "role:bar-team", role: owner}
customProperties:
  - {property: layer, value: gold}
  - {property: urn, value: org.example.foo-bar.bar.gold.bar-uf-monthly}
  - {property: dbtModel, value: bar_uf_monthly}
  - property: classification
    value: {sharing: broad, nature: aggregated, secrecy: none}
contractCreatedTs: "2026-11-14T00:00:00Z"
