# bar publication series (schema: statera publication-series.schema.json).
series: bar
title: Bar — records and value by UF (SYNTHETIC DATA)
product: bar
frequency: monthly
start: "2026-01"
page: https://example.org/foo-bar/bar  # illustrative
license:
  name: CC-BY-4.0
  path: https://creativecommons.org/licenses/by/4.0/
  title: Creative Commons Attribution 4.0 (illustrative)
files_per_edition:
  tables: "{port}.csv"
  spreadsheet: "bar-{period}.xlsx"
  summary: summary.md
  metadata: [datapackage.json, ckan.json]
main_resource: by-uf
coverage: Each edition republishes the current year up to the edition's reference month, at the edition's cut.
revision_policy: Already released reference months are revised at each edition; the previous edition is not changed.
correction_policy: A published edition is not recomputed; a correction requires `statera run --force`.
edition_registry:
  edition: "bar/{period}.datapackage.json"
  index: bar/editions.csv
  written_by: to-be process (task Task_Publish)
