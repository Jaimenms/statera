# Contrato ODCS v3.1 — gold de baz, calculada pelo script SPSS legado (via PSPP). DADOS SINTÉTICOS.
apiVersion: v3.1.0
kind: DataContract
id: gold-baz-uf-mensal
name: Baz — valor médio por UF e competência
version: 0.1.0
status: active
domain: foo
dataProduct: baz
tags: [gold, baz, divulgacao, legado, spss]
description:
  purpose: Valor médio dos registros por UF e competência (RN-BAZ-001), pelo script SPSS legado.
  usage: Tabela de divulgação mensal; sempre com a data de corte.
  limitations: Calculada pelo PSPP; equivalência com o SPSS a certificar. DADOS SINTÉTICOS.
servers:
  - {server: warehouse-local, type: duckdb, database: dbt/data/warehouse.duckdb, schema: gold, environment: dev}
schema:
  - name: baz_uf_mensal
    physicalName: gold.baz_uf_mensal
    physicalType: table
    logicalType: object
    dataGranularityDescription: Uma linha por competência e UF com registros
    properties:
      - {name: competencia, logicalType: string, physicalType: VARCHAR, required: true, primaryKey: true, primaryKeyPosition: 1, classification: broad}
      - {name: sigla_uf, logicalType: string, physicalType: VARCHAR, required: true, primaryKey: true, primaryKeyPosition: 2, classification: broad}
      - {name: data_corte, logicalType: date, physicalType: DATE, required: true, classification: broad}
      - {name: registros, logicalType: integer, physicalType: BIGINT, required: true, classification: broad}
      - {name: valor_medio, logicalType: number, physicalType: DOUBLE, classification: broad}
    quality:
      - {id: linhas_presentes, type: library, metric: rowCount, mustBeGreaterThan: 0}
team:
  name: Equipe técnica de Bar
  members:
    - {username: "papel:equipe-bar", role: owner}
customProperties:
  - {property: layer, value: gold}
  - {property: urn, value: br.gov.foo-bar.baz.gold.baz-uf-mensal}
  - {property: dbtModel, value: baz_uf_mensal}
  - property: classification
    value: {sharing: broad, nature: aggregated, secrecy: none}
contractCreatedTs: "2026-11-14T00:00:00Z"
