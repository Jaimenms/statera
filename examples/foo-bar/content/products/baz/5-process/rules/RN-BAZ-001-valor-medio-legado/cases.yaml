rule: RN-BAZ-001
model: baz_uf_mensal
variables: {cut_date: "2026-03-10"}
requires: [pspp]
cases:
  - id: media_por_uf_e_mes
    description: Dois registros de SP em janeiro (10 e 30) dão média 20; um de RJ (5) dá 5.
    inputs:
      int_baz__registros:
        - {competencia: "2026-01", cod_uf: 35, valor: 10.0}
        - {competencia: "2026-01", cod_uf: 35, valor: 30.0}
        - {competencia: "2026-01", cod_uf: 33, valor: 5.0}
      ref_uf:
        - {cod_uf: 35, sigla_uf: SP}
        - {cod_uf: 33, sigla_uf: RJ}
    expected:
      - {competencia: "2026-01", sigla_uf: SP, registros: 2, valor_medio: 20.0}
      - {competencia: "2026-01", sigla_uf: RJ, registros: 1, valor_medio: 5.0}
