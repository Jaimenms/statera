version: 2

models:
  - name: baz_uf_monthly
    description: >
      Mean value by UF and reference month, from the legacy SPSS script (baz_uf_monthly.sps) run by
      GNU PSPP from within a Python model (BR-BAZ-001).
    config:
      cut_date: "{{ var('cut_date') }}"  # Python models read variables through config
    columns:
      - name: period
        data_tests: [not_null]

  - name: baz_uf_monthly_median
    description: >
      Median value by UF and reference month, from the legacy R script (baz_uf_monthly_median.R) run
      by Rscript from within a Python model (BR-BAZ-002).
    config:
      cut_date: "{{ var('cut_date') }}"  # Python models read variables through config
    columns:
      - name: period
        data_tests: [not_null]
