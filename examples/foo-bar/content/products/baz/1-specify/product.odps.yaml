# DISSEMINATION product computed by LEGACY code: an SPSS script (run by GNU PSPP) and an
# R script (run by Rscript), both called from dbt Python models. Level 2 (reproducible): the script runs
# from the repository, on the foo cut, but has not been rewritten yet and has no executable process.
# ILLUSTRATIVE EXAMPLE, SYNTHETIC DATA.
apiVersion: v1.0.0
kind: DataProduct
id: baz
name: Baz — mean value and median by UF (legacy SPSS and R scripts)
version: 0.1.0
status: active
domain: foo
tenant: Foo Bar (minimal example)
description:
  purpose: Mean value (SPSS script) and median (R script) of records by UF and reference month, from the pre-existing scripts.
  usage: Monthly release until the script is rewritten in SQL or pandas.
  limitations: >
    The mean value is computed by PSPP, which is not SPSS: equivalence must be certified
    before the result replaces the SPSS one. Requires GNU PSPP and R installed. SYNTHETIC DATA.
tags: [monthly, legacy, spss, r]
customProperties:
  - {property: alignment, value: consumer}
  - {property: visibility, value: public}
  - {property: theme, value: foo}
  - {property: frequency, value: monthly}
  - {property: purpose, value: official-release}
  - {property: bases, value: [foo-system]}
  - {property: urn, value: org.example.foo-bar.baz}
  - {property: conformanceLevel, value: 2}
  - {property: legacyParity, value: in-progress}
inputPorts:
  - {name: records, version: 1.0.0, contractId: bronze-foo-records}
  - {name: ufs, version: 1.0.0, contractId: ref-uf}
outputPorts:
  - name: mean-value-by-uf
    description: Mean value of records by UF and reference month (legacy SPSS script, via PSPP)
    type: table
    customProperties:
      - {property: spreadsheetTab, value: "UF"}
    version: 0.1.0
    contractId: gold-baz-uf-monthly
    inputContracts:
      - {id: bronze-foo-records, version: 1.0.0}
      - {id: ref-uf, version: 1.0.0}
  - name: median-by-uf
    description: Median value by UF and reference month (legacy R script, via Rscript)
    type: table
    customProperties:
      - {property: spreadsheetTab, value: "Median"}
    version: 0.1.0
    contractId: gold-baz-uf-monthly-median
    inputContracts:
      - {id: bronze-foo-records, version: 1.0.0}
      - {id: ref-uf, version: 1.0.0}
