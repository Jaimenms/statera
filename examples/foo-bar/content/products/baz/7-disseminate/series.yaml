# baz publication series (schema: statera publication-series.schema.json).
series: baz
title: Baz — mean value by UF (legacy SPSS script; SYNTHETIC DATA)
product: baz
frequency: monthly
start: "2026-01"
page: https://example.org/foo-bar/baz  # illustrative
license:
  name: CC-BY-4.0
  path: https://creativecommons.org/licenses/by/4.0/
  title: Creative Commons Attribution 4.0 (illustrative)
files_per_edition:
  tables: "{port}.csv"
  spreadsheet: "baz-{period}.xlsx"
  summary: summary.md
  metadata: [datapackage.json, ckan.json]
main_resource: mean-value-by-uf
coverage: Each edition republishes the current year up to the edition's reference month, at the edition's cut.
revision_policy: Already released reference months are revised at each edition; the previous edition is not changed.
correction_policy: A published edition is not recomputed; a correction requires `statera run --force`.
edition_registry:
  edition: "baz/{period}.datapackage.json"
  index: baz/editions.csv
  written_by: to-be process (task Task_Publish), once it exists
