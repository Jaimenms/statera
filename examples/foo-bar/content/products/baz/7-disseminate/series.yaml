# Série de publicações de baz (schema: statera publication-series.schema.json).
series: baz
title: Baz — valor médio por UF (script SPSS legado; DADOS SINTÉTICOS)
product: baz
frequency: monthly
start: "2026-01"
page: https://example.org/foo-bar/baz  # ilustrativo
license:
  name: CC-BY-4.0
  path: https://creativecommons.org/licenses/by/4.0/
  title: Creative Commons Attribution 4.0 (ilustrativo)
files_per_edition:
  tables: "{porta}.csv"
  spreadsheet: "baz-{competencia}.xlsx"
  summary: summary.md
  metadata: [datapackage.json, ckan.json]
main_resource: valor-medio-uf
coverage: Cada edição republica o ano corrente até a competência da edição, no corte da edição.
revision_policy: Competências já divulgadas são revistas a cada edição; a edição anterior não é alterada.
correction_policy: Uma edição publicada não é recalculada; retificar exige `statera run --force`.
edition_registry:
  edition: "baz/{competencia}.datapackage.json"
  index: baz/editions.csv
  written_by: processo to-be (tarefa Task_Publicar), quando houver
