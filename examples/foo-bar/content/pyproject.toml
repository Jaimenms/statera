[project]
name = "statera-example-foo-bar"
version = "0.1.0"
description = "Repositório de conteúdo de exemplo mínimo no padrão statera (dados sintéticos)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = ["statera"]

[tool.uv]
package = false  # repositório de conteúdo: não é um pacote Python

[tool.uv.sources]
statera = { path = "../../..", editable = true }  # a plataforma deste repositório

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 120
target-version = "py311"
