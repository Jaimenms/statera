      cod_uf: 35
      competencia: 2026-01
      valor: 100.0
      data_corte: '2026-03-10'
    - id_registro: R2
      cod_uf: 35
      competencia: 2026-01
      valor: 300.0
      data_corte: '2026-03-10'
    - id_registro: R3
      cod_uf: 35
      competencia: 2026-02
      valor: 50.0
