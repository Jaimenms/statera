  - input: ref('ref_uf')
    rows:
    - cod_uf: 35
      sigla_uf: SP
      nome_uf: São Paulo
  expect:
    rows:
    - competencia: 2026-01
      sigla_uf: SP
      registros: 2
      valor_total: 400.0
      valor_medio: 200.0
    - competencia: 2026-02
      sigla_uf: SP
      registros: 1
      valor_total: 50.0
