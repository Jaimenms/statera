<script id="diagrama" type="application/xml"><?xml version="1.0" encoding="UTF-8"?>

<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:statera="urn:statera:bpmn:1.0" id="Definitions_Processo_Bar_ToBe" targetNamespace="urn:statera:processos" exporter="statera (statera bpmn)" exporterVersion="1.0">
  <bpmn:collaboration id="Collab_Processo_Bar_ToBe">
    <bpmn:participant id="Pool_Processo_Bar_ToBe" name="Produção mensal de Bar (TO-BE)" processRef="Processo_Bar_ToBe" />
  </bpmn:collaboration>
  <bpmn:process id="Processo_Bar_ToBe" isExecutable="false">
    <bpmn:laneSet id="LaneSet_Processo_Bar_ToBe">
      <bpmn:lane id="Lane_Pipeline" name="Pipeline (statera run)" statera:papel="equipe-dados">
        <bpmn:flowNodeRef>Start_DataCorte</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Event_Corte</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_Transformar</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_Controles</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Gateway_Controles</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_Pacote</bpmn:flowNodeRef>
      </bpmn:lane>
      <bpmn:lane id="Lane_Equipe" name="Equipe técnica de Bar" statera:papel="equipe-bar">
        <bpmn:flowNodeRef>Task_Investigar</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_Aprovar</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Gateway_Aprovado</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_Publicar</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>End_Publicado</bpmn:flowNodeRef>
      </bpmn:lane>
    </bpmn:laneSet>
    <bpmn:startEvent id="Start_DataCorte" name="Data de corte do calendário">
      <bpmn:outgoing>Flow_1</bpmn:outgoing>
      <bpmn:timerEventDefinition id="Def_Start_DataCorte" />
    </bpmn:startEvent>
    <bpmn:intermediateCatchEvent id="Event_Corte" name="Corte de foo disponível" statera:awaits="py:statera.collect.pin_cut">
      <bpmn:incoming>Flow_1</bpmn:incoming>
      <bpmn:outgoing>Flow_2</bpmn:outgoing>
      <bpmn:messageEventDefinition id="Def_Event_Corte" />
    </bpmn:intermediateCatchEvent>
    <bpmn:serviceTask id="Task_Transformar" name="Calcular as tabelas do produto (dbt build)" statera:type="automatic" statera:gsbpm="5.3-5.7" statera:durationMin="1" statera:implementation="dbt:build" statera:models="stg_foo__registros,int_bar__registros,bar_uf_mensal,bar_variacao_uf_mensal">
      <bpmn:incoming>Flow_2</bpmn:incoming>
      <bpmn:incoming>Flow_7</bpmn:incoming>
      <bpmn:outgoing>Flow_3</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:serviceTask id="Task_Controles" name="Verificar contratos e controles entre edições" statera:type="automatic" statera:gsbpm="6.2" statera:durationMin="1" statera:implementation="py:statera.analyse.step">
      <bpmn:incoming>Flow_3</bpmn:incoming>
      <bpmn:outgoing>Flow_4</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:exclusiveGateway id="Gateway_Controles" name="Controles OK?">
      <bpmn:incoming>Flow_4</bpmn:incoming>
      <bpmn:outgoing>Flow_5</bpmn:outgoing>
      <bpmn:outgoing>Flow_6</bpmn:outgoing>
    </bpmn:exclusiveGateway>
    <bpmn:serviceTask id="Task_Pacote" name="Gerar xlsx, sumário e Data Package" statera:type="automatic" statera:gsbpm="6.4;7.2" statera:durationMin="1" statera:implementation="py:statera.disseminate.step">
      <bpmn:incoming>Flow_5</bpmn:incoming>
      <bpmn:outgoing>Flow_8</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:userTask id="Task_Investigar" name="Investigar a falha" statera:type="manual" statera:gsbpm="5.3" statera:durationMin="60" statera:exception="true">
      <bpmn:incoming>Flow_6</bpmn:incoming>
      <bpmn:outgoing>Flow_7</bpmn:outgoing>
    </bpmn:userTask>
    <bpmn:userTask id="Task_Aprovar" name="Revisar e aprovar a divulgação" statera:type="manual" statera:gsbpm="6.5" statera:durationMin="30">
      <bpmn:incoming>Flow_8</bpmn:incoming>
      <bpmn:incoming>Flow_11</bpmn:incoming>
      <bpmn:outgoing>Flow_9</bpmn:outgoing>
    </bpmn:userTask>
    <bpmn:exclusiveGateway id="Gateway_Aprovado" name="Aprovado?">
      <bpmn:incoming>Flow_9</bpmn:incoming>
      <bpmn:outgoing>Flow_10</bpmn:outgoing>
      <bpmn:outgoing>Flow_11</bpmn:outgoing>
    </bpmn:exclusiveGateway>
    <bpmn:userTask id="Task_Publicar" name="Publicar o pacote" statera:type="semi-automatic" statera:gsbpm="7.3" statera:durationMin="10" statera:implementation="py:statera.disseminate.publish">
      <bpmn:incoming>Flow_10</bpmn:incoming>
      <bpmn:outgoing>Flow_12</bpmn:outgoing>
    </bpmn:userTask>
    <bpmn:endEvent id="End_Publicado" name="Edição publicada">
      <bpmn:incoming>Flow_12</bpmn:incoming>
    </bpmn:endEvent>
    <bpmn:sequenceFlow id="Flow_1" sourceRef="Start_DataCorte" targetRef="Event_Corte" />
    <bpmn:sequenceFlow id="Flow_2" sourceRef="Event_Corte" targetRef="Task_Transformar" />
    <bpmn:sequenceFlow id="Flow_3" sourceRef="Task_Transformar" targetRef="Task_Controles" />
    <bpmn:sequenceFlow id="Flow_4" sourceRef="Task_Controles" targetRef="Gateway_Controles" />
    <bpmn:sequenceFlow id="Flow_5" sourceRef="Gateway_Controles" targetRef="Task_Pacote" name="sim">
      <bpmn:conditionExpression xsi:type="bpmn:tFormalExpression">${situacao == 'ok'}</bpmn:conditionExpression>
    </bpmn:sequenceFlow>
    <bpmn:sequenceFlow id="Flow_6" sourceRef="Gateway_Controles" targetRef="Task_Investigar" name="não">
      <bpmn:conditionExpression xsi:type="bpmn:tFormalExpression">${situacao == 'failed'}</bpmn:conditionExpression>
    </bpmn:sequenceFlow>
    <bpmn:sequenceFlow id="Flow_7" sourceRef="Task_Investigar" targetRef="Task_Transformar" />
    <bpmn:sequenceFlow id="Flow_8" sourceRef="Task_Pacote" targetRef="Task_Aprovar" />
    <bpmn:sequenceFlow id="Flow_9" sourceRef="Task_Aprovar" targetRef="Gateway_Aprovado" />
    <bpmn:sequenceFlow id="Flow_10" sourceRef="Gateway_Aprovado" targetRef="Task_Publicar" name="sim">
      <bpmn:conditionExpression xsi:type="bpmn:tFormalExpression">${situacao == 'approved'}</bpmn:conditionExpression>
    </bpmn:sequenceFlow>
    <bpmn:sequenceFlow id="Flow_11" sourceRef="Gateway_Aprovado" targetRef="Task_Aprovar" name="não">
      <bpmn:conditionExpression xsi:type="bpmn:tFormalExpression">${situacao == 'rejected'}</bpmn:conditionExpression>
    </bpmn:sequenceFlow>
    <bpmn:sequenceFlow id="Flow_12" sourceRef="Task_Publicar" targetRef="End_Publicado" />
  </bpmn:process>

      </bpmndi:BPMNShape>
      <bpmndi:BPMNEdge id="Flow_1_di" bpmnElement="Flow_1">
        <di:waypoint x="198" y="155" />

<script>
  const viewer = new BpmnJS({ container: '#canvas' });
  viewer.importXML(document.getElementById('diagrama').textContent)
    .then(() => viewer.get('canvas').zoom('fit-viewport'))
    .catch(err => document.getElementById('canvas').innerText = 'Erro: ' + err.message);
