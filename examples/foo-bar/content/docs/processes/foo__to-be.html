<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extração do Sistema Foo (TO-BE)</title>
<link rel="stylesheet" href="https://unpkg.com/bpmn-js@18.30.1/dist/assets/diagram-js.css">
<link rel="stylesheet" href="https://unpkg.com/bpmn-js@18.30.1/dist/assets/bpmn-js.css">
<style>html,body{margin:0;height:100%;font-family:Helvetica,Arial,sans-serif;background:#fff}
#topo{padding:8px 16px;border-bottom:1px solid #ddd} #canvas{height:calc(100% - 50px)}</style>
</head>
<body>
<div id="topo"><strong>Extração do Sistema Foo (TO-BE)</strong> — arraste para mover, role para ampliar.
Fonte: <code>products/foo/2-design/processes/to-be.bpmn</code></div>
<div id="canvas"></div>
<script src="https://unpkg.com/bpmn-js@18.30.1/dist/bpmn-navigated-viewer.production.min.js"></script>
<script id="diagrama" type="application/xml"><?xml version="1.0" encoding="UTF-8"?>
<!--
  ARQUIVO GERADO pela plataforma Statera. Não edite à mão: a próxima geração desfaz a mudança.
  Gerado por `statera bpmn`. Fontes: to-be.yaml (o processo em YAML, espelho do BPMN).
  Para mudar: edite as fontes e rode `statera sync`. O CI falha se este arquivo estiver desatualizado.
  Para desenhar: abra este .bpmn no Camunda Modeler ou no bpmn.io e rode
  `statera bpmn import <este arquivo>` para levar a mudança ao YAML.
-->
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:statera="urn:statera:bpmn:1.0" id="Definitions_Processo_Foo_ToBe" targetNamespace="urn:statera:processos" exporter="statera (statera bpmn)" exporterVersion="1.0">
  <bpmn:collaboration id="Collab_Processo_Foo_ToBe">
    <bpmn:participant id="Pool_Processo_Foo_ToBe" name="Extração do Sistema Foo (TO-BE)" processRef="Processo_Foo_ToBe" />
  </bpmn:collaboration>
  <bpmn:process id="Processo_Foo_ToBe" isExecutable="false">
    <bpmn:laneSet id="LaneSet_Processo_Foo_ToBe">
      <bpmn:lane id="Lane_Dados" name="Equipe de dados (statera run)" statera:papel="equipe-dados">
        <bpmn:flowNodeRef>Start_Corte</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_Extrair</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_Validar</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Gateway_Ok</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_MarcarCorte</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_Investigar</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>End_Corte</bpmn:flowNodeRef>
      </bpmn:lane>
    </bpmn:laneSet>
    <bpmn:startEvent id="Start_Corte" name="Data de corte pedida pelos consumidores">
      <bpmn:outgoing>Flow_1</bpmn:outgoing>
      <bpmn:timerEventDefinition id="Def_Start_Corte" />
    </bpmn:startEvent>
    <bpmn:serviceTask id="Task_Extrair" name="Extrair o incremento recebido desde a última carga" statera:type="automatic" statera:gsbpm="4.3" statera:durationMin="1" statera:implementation="py:statera.collect.step">
      <bpmn:incoming>Flow_1</bpmn:incoming>
      <bpmn:incoming>Flow_6</bpmn:incoming>
      <bpmn:outgoing>Flow_2</bpmn:outgoing>
      <bpmn:dataOutputAssociation id="DataOut_Task_Extrair_1"><bpmn:targetRef>Store_Bronze</bpmn:targetRef></bpmn:dataOutputAssociation>
    </bpmn:serviceTask>
    <bpmn:serviceTask id="Task_Validar" name="Verificar o contrato do bronze no corte" statera:type="automatic" statera:gsbpm="4.4" statera:durationMin="1" statera:implementation="py:statera.analyse.step">
      <bpmn:incoming>Flow_2</bpmn:incoming>
      <bpmn:outgoing>Flow_3</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:exclusiveGateway id="Gateway_Ok" name="Carga OK?">
      <bpmn:incoming>Flow_3</bpmn:incoming>
      <bpmn:outgoing>Flow_4</bpmn:outgoing>
      <bpmn:outgoing>Flow_5</bpmn:outgoing>
    </bpmn:exclusiveGateway>
    <bpmn:serviceTask id="Task_MarcarCorte" name="Marcar o corte e avisar os consumidores" statera:type="automatic" statera:gsbpm="7.3" statera:durationMin="1" statera:implementation="py:statera.disseminate.mark_cut">
      <bpmn:incoming>Flow_4</bpmn:incoming>
      <bpmn:outgoing>Flow_7</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:userTask id="Task_Investigar" name="Investigar a carga com o Sistema Foo" statera:type="manual" statera:gsbpm="4.3" statera:durationMin="60" statera:exception="true">
      <bpmn:incoming>Flow_5</bpmn:incoming>
      <bpmn:outgoing>Flow_6</bpmn:outgoing>
    </bpmn:userTask>
    <bpmn:endEvent id="End_Corte" name="Corte disponível">
      <bpmn:incoming>Flow_7</bpmn:incoming>
    </bpmn:endEvent>
    <bpmn:sequenceFlow id="Flow_1" sourceRef="Start_Corte" targetRef="Task_Extrair" />
    <bpmn:sequenceFlow id="Flow_2" sourceRef="Task_Extrair" targetRef="Task_Validar" />
    <bpmn:sequenceFlow id="Flow_3" sourceRef="Task_Validar" targetRef="Gateway_Ok" />
    <bpmn:sequenceFlow id="Flow_4" sourceRef="Gateway_Ok" targetRef="Task_MarcarCorte" name="sim">
      <bpmn:conditionExpression xsi:type="bpmn:tFormalExpression">${situacao == 'ok'}</bpmn:conditionExpression>
    </bpmn:sequenceFlow>
    <bpmn:sequenceFlow id="Flow_5" sourceRef="Gateway_Ok" targetRef="Task_Investigar" name="não">
      <bpmn:conditionExpression xsi:type="bpmn:tFormalExpression">${situacao == 'failed'}</bpmn:conditionExpression>
    </bpmn:sequenceFlow>
    <bpmn:sequenceFlow id="Flow_6" sourceRef="Task_Investigar" targetRef="Task_Extrair" />
    <bpmn:sequenceFlow id="Flow_7" sourceRef="Task_MarcarCorte" targetRef="End_Corte" />
    <bpmn:dataStoreReference id="Store_Bronze" name="Bronze (lotes imutáveis)" statera:ativo="bronze-foo-registros" />
  </bpmn:process>
  <bpmndi:BPMNDiagram id="Diagram_Processo_Foo_ToBe">
    <bpmndi:BPMNPlane id="Plane_Processo_Foo_ToBe" bpmnElement="Collab_Processo_Foo_ToBe">
      <bpmndi:BPMNShape id="Pool_Processo_Foo_ToBe_di" bpmnElement="Pool_Processo_Foo_ToBe" isHorizontal="true">
        <dc:Bounds x="20" y="80" width="1375" height="230" />
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape id="Lane_Dados_di" bpmnElement="Lane_Dados" isHorizontal="true">
        <dc:Bounds x="50" y="80" width="1345" height="230" />
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape id="Start_Corte_di" bpmnElement="Start_Corte">
        <dc:Bounds x="162" y="132" width="36" height="36" />
        <bpmndi:BPMNLabel><dc:Bounds x="130" y="172" width="100" height="27" /></bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape id="Task_Extrair_di" bpmnElement="Task_Extrair">
        <dc:Bounds x="285" y="110" width="140" height="80" />
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape id="Task_Validar_di" bpmnElement="Task_Validar">
        <dc:Bounds x="460" y="110" width="140" height="80" />
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape id="Gateway_Ok_di" bpmnElement="Gateway_Ok" isMarkerVisible="true">
        <dc:Bounds x="680" y="125" width="50" height="50" />
        <bpmndi:BPMNLabel><dc:Bounds x="655" y="179" width="100" height="27" /></bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape id="Task_MarcarCorte_di" bpmnElement="Task_MarcarCorte">
        <dc:Bounds x="810" y="110" width="140" height="80" />
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape id="Task_Investigar_di" bpmnElement="Task_Investigar">
        <dc:Bounds x="985" y="110" width="140" height="80" />
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape id="End_Corte_di" bpmnElement="End_Corte">
        <dc:Bounds x="1212" y="132" width="36" height="36" />
        <bpmndi:BPMNLabel><dc:Bounds x="1180" y="172" width="100" height="27" /></bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape id="Store_Bronze_di" bpmnElement="Store_Bronze">
        <dc:Bounds x="295" y="235" width="50" height="50" />
        <bpmndi:BPMNLabel><dc:Bounds x="270" y="289" width="100" height="27" /></bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>
      <bpmndi:BPMNEdge id="Flow_1_di" bpmnElement="Flow_1">
        <di:waypoint x="198" y="150" />
        <di:waypoint x="285" y="150" />
      </bpmndi:BPMNEdge>
      <bpmndi:BPMNEdge id="Flow_2_di" bpmnElement="Flow_2">
        <di:waypoint x="425" y="150" />
        <di:waypoint x="460" y="150" />
      </bpmndi:BPMNEdge>
      <bpmndi:BPMNEdge id="Flow_3_di" bpmnElement="Flow_3">
        <di:waypoint x="600" y="150" />
        <di:waypoint x="680" y="150" />
      </bpmndi:BPMNEdge>
      <bpmndi:BPMNEdge id="Flow_4_di" bpmnElement="Flow_4">
        <di:waypoint x="730" y="150" />
        <di:waypoint x="810" y="150" />
        <bpmndi:BPMNLabel><dc:Bounds x="736" y="132" width="30" height="14" /></bpmndi:BPMNLabel>
      </bpmndi:BPMNEdge>
      <bpmndi:BPMNEdge id="Flow_5_di" bpmnElement="Flow_5">
        <di:waypoint x="730" y="150" />
        <di:waypoint x="985" y="150" />
        <bpmndi:BPMNLabel><dc:Bounds x="736" y="132" width="30" height="14" /></bpmndi:BPMNLabel>
      </bpmndi:BPMNEdge>
      <bpmndi:BPMNEdge id="Flow_6_di" bpmnElement="Flow_6">
        <di:waypoint x="1055" y="190" />
        <di:waypoint x="1055" y="212" />
        <di:waypoint x="355" y="212" />
        <di:waypoint x="355" y="190" />
      </bpmndi:BPMNEdge>
      <bpmndi:BPMNEdge id="Flow_7_di" bpmnElement="Flow_7">
        <di:waypoint x="950" y="150" />
        <di:waypoint x="1212" y="150" />
      </bpmndi:BPMNEdge>
      <bpmndi:BPMNEdge id="DataOut_Task_Extrair_1_di" bpmnElement="DataOut_Task_Extrair_1">
        <di:waypoint x="320" y="190" />
        <di:waypoint x="320" y="235" />
      </bpmndi:BPMNEdge>
    </bpmndi:BPMNPlane>
  </bpmndi:BPMNDiagram>
</bpmn:definitions>
</script>
<script>
  const viewer = new BpmnJS({ container: '#canvas' });
  viewer.importXML(document.getElementById('diagrama').textContent)
    .then(() => viewer.get('canvas').zoom('fit-viewport'))
    .catch(err => document.getElementById('canvas').innerText = 'Erro: ' + err.message);
</script>
</body>
</html>
