  --code-bg: #101315; --kw: #cf9bea; --str: #8fd3a3; --num: #f0a877; --com: #7f8a91; --jin: #f08fb8;

:root[data-mode="dark"] .logo.for-dark { display: block; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: .92em; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--soft); }

/* the bar on top: where one is, and the search */
.head { position: sticky; top: 0; z-index: 5; }
.notice { background: var(--warn-soft); color: var(--warn); text-align: center; font-size: 12.5px; letter-spacing: .04em; padding: 3px 12px; }
.top { display: flex; align-items: center; gap: 16px; padding: 9px 18px; background: var(--top, var(--side));
  color: var(--top-ink, var(--ink)); border-bottom: 1px solid var(--line); }
.brand { color: inherit; min-width: 236px; max-width: 460px; flex: 0 1 auto; display: flex; align-items: center; gap: 11px; line-height: 1.25; }
.brand .names { display: flex; flex-direction: column; min-width: 0; }
.logo { height: var(--logo-h); width: auto; display: block; flex: none; } .logo.for-dark { display: none; }
.toplinks { margin-left: auto; display: flex; gap: 16px; font-size: 13.5px; white-space: nowrap; }
.toplinks a { color: inherit; }
nav .links { display: none; margin-top: 18px; border-top: 1px solid var(--line); padding-top: 8px; }
nav .links a { display: block; padding: 4px 8px; font-size: 13.5px; }
.brand:hover { text-decoration: none; }
.brand b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .names span { opacity: .72; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.find { position: relative; flex: 1; max-width: 640px; }
.find input { width: 100%; padding: 8px 40px 8px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--ink); font: inherit; }
.find input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.find kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; }
#menu { display: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px;
  padding: 6px 10px; font: inherit; cursor: pointer; }

.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); }
aside { background: var(--side); border-right: 1px solid var(--line); padding: 10px 10px 30px; position: sticky;
  top: var(--top-h, 53px); height: calc(100vh - var(--top-h, 53px)); overflow-y: auto; }
nav h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); margin: 18px 8px 4px; font-weight: 600; }
nav .row { display: flex; align-items: center; border-radius: 6px; }
nav .row:hover { background: var(--line); }
nav .row.on { background: var(--accent-soft); }
nav .row.on > a { color: var(--accent); font-weight: 600; }
nav .row a { flex: 1; min-width: 0; padding: 5px 8px; color: var(--ink); font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
nav .row a:hover { text-decoration: none; }
nav .row a span { color: var(--soft); font-size: 12.5px; font-weight: 400; }
nav .row.none a { color: var(--soft); }
nav .row button { border: 0; background: none; color: var(--soft); cursor: pointer; padding: 5px 8px; font-size: 11px; border-radius: 6px; }
nav .items { margin: 1px 0 6px 10px; border-left: 1px solid var(--line); padding-left: 6px; }
nav .items a { display: block; padding: 3px 8px; border-radius: 6px; color: var(--ink); font-size: 13px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
nav .items a:hover { background: var(--line); text-decoration: none; }
nav .items a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav .items .more { color: var(--soft); font-style: italic; }

main { padding: 26px 36px 80px; max-width: 1080px; min-width: 0; outline: none; }
.crumb { color: var(--soft); font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; }
.crumb a { color: var(--soft); }
h1.title { font-size: 27px; line-height: 1.2; margin: 3px 0 6px; text-wrap: balance; font-weight: 700; }
.ident { font-family: var(--mono); font-size: 12.5px; color: var(--soft); overflow-wrap: anywhere; }
.lead { font-size: 16.5px; margin: 14px 0; max-width: 72ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; font-size: 12.5px; background: var(--panel);
  white-space: nowrap; }
.chip i { color: var(--soft); font-style: normal; }
.chip.gold { border-color: var(--gold); color: var(--gold); } .chip.silver { border-color: var(--silver); color: var(--silver); }
.chip.bronze { border-color: var(--bronze); color: var(--bronze); } .chip.ref { border-color: var(--ref); color: var(--ref); }
.chip.warn { border-color: var(--warn); color: var(--warn); }
h2.sec { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); margin: 34px 0 9px; font-weight: 600; }
h2.sec small { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 13px; margin-left: 6px; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 20px; margin: 0; }
.facts dt { color: var(--soft); } .facts dd { margin: 0; overflow-wrap: anywhere; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; margin: 10px 0; max-width: 80ch; }
.mind { margin: 0; padding-left: 18px; max-width: 80ch; } .mind li { margin: 3px 0; }
.empty { color: var(--soft); border: 1px dashed var(--line); border-radius: 10px; padding: 16px 18px; max-width: 72ch; }

.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.field label, .field legend { display: block; font-family: var(--mono); font-size: 13px; font-weight: 600; padding: 0; }
.field label em, .field legend em { font: 12px system-ui, sans-serif; color: var(--soft); font-style: normal; font-weight: 400; }
.field input[type=text], .field input[type=month], .field input[type=date] { width: 100%; margin-top: 4px; padding: 7px 9px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: 14px var(--mono); }
.field input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.field.bad input { border-color: var(--miss-ink); }
.field .hint { font-size: 12px; color: var(--soft); margin-top: 3px; }
.field.bad .hint { color: var(--miss-ink); }
fieldset.field { border: 0; margin: 0; padding: 0; min-width: 0; }
.field .pick { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 14px; }
.field .pick label { font: inherit; font-family: var(--mono); font-weight: 400; display: flex; gap: 5px; align-items: center; }

.codebox { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--code-bg); margin-top: 12px; }
.bar { display: flex; align-items: center; gap: 2px; padding: 5px 6px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.tab { border: 0; background: none; color: var(--soft); font: inherit; font-size: 13.5px; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.bar .gap { flex: 1; }
.bar label.opt { font-size: 12.5px; color: var(--soft); display: flex; align-items: center; gap: 5px; margin-right: 8px; }
button.copy { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 4px 12px;
  font: inherit; font-size: 13px; cursor: pointer; min-width: 74px; }
button.copy:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button.copy:disabled { opacity: .5; cursor: not-allowed; }
button.copy.done { background: var(--accent); border-color: var(--accent); color: var(--bg); }
pre { margin: 0; padding: 14px 16px; overflow-x: auto; font: 13.5px/1.6 var(--mono); tab-size: 4; }
.why { padding: 7px 16px; font-size: 12.5px; color: var(--soft); border-top: 1px solid var(--line); background: var(--panel); }
.why.stop { color: var(--miss-ink); }
.k { color: var(--kw); font-weight: 600; } .s { color: var(--str); } .n { color: var(--num); }
.c { color: var(--com); font-style: italic; } .j { color: var(--jin); }
mark { border-radius: 4px; padding: 1px 3px; }
mark.fill { background: var(--fill); color: var(--fill-ink); }
mark.miss { background: var(--miss); color: var(--miss-ink); }
mark.hit { background: var(--fill); color: var(--fill-ink); padding: 0 1px; }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; font-size: 13.5px; width: 100%; }
th { text-align: left; color: var(--soft); font-weight: 600; font-size: 12.5px; border-bottom: 1px solid var(--line); padding: 5px 14px 5px 0; white-space: nowrap; }
td { border-bottom: 1px solid var(--line); padding: 5px 14px 5px 0; vertical-align: top; }
td.m, th.m { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
td.r { text-align: right; font-variant-numeric: tabular-nums; }
td.null { color: var(--soft); font-style: italic; }
.case { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; }
.case p { margin: 0 0 8px; }
.ghost { border: 1px solid var(--line); background: none; color: var(--accent); border-radius: 6px; padding: 3px 10px; font: inherit;
  font-size: 13px; cursor: pointer; }
.ghost.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
details { margin: 8px 0; } summary { cursor: pointer; color: var(--soft); font-size: 13.5px; }

/* lists of things: an index page, the search, the cards of the first page */
.facets { display: flex; flex-wrap: wrap; gap: 6px 6px; align-items: center; margin: 14px 0 6px; font-size: 13px; color: var(--soft); }
.facets span { margin: 0 2px 0 10px; } .facets span:first-child { margin-left: 0; }
.list { border-top: 1px solid var(--line); margin-top: 10px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 10px 6px; border-bottom: 1px solid var(--line); color: var(--ink); }
.item:hover, .item.sel { background: var(--panel); text-decoration: none; }
.item.sel { box-shadow: inset 3px 0 0 var(--accent); }
.item b { font-weight: 600; } .item .ident { grid-column: 1; }
.item p { margin: 0; color: var(--soft); font-size: 13.5px; grid-column: 1; }
.item .chips { margin: 0; grid-column: 2; grid-row: 1 / span 3; align-content: start; justify-content: end; max-width: 300px; }
.item .kind { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-right: 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.tile h3 { margin: 0; font-size: 16px; } .tile p { margin: 0; color: var(--soft); font-size: 14px; flex: 1; }
.tile .go { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; font-weight: 600; }
.figure { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px; overflow: auto; max-height: 78vh; }
.figure svg { max-width: none; display: block; }
.figure.fit svg { width: 100%; height: auto; }
.figtools { display: flex; justify-content: flex-end; margin-bottom: 6px; }
.prose { max-width: 80ch; } .prose table { width: auto; margin: 8px 0; }
.prose h3, .prose h4 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); margin: 24px 0 6px; font-weight: 600; }
.prose pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; }
.words { max-width: 80ch; } .words dt { font-weight: 700; margin-top: 18px; font-size: 16px; } .words dd { margin: 4px 0 0; }
.words table { width: auto; margin-top: 6px; }
footer { color: var(--soft); font-size: 12.5px; margin-top: 56px; border-top: 1px solid var(--line); padding-top: 10px; max-width: 80ch; }
@media (max-width: 860px) {
  #menu { display: block; } .brand .names span { display: none; } .brand { min-width: 0; max-width: 34vw; }
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { display: none; position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  body.menu aside { display: block; }
  main { padding: 18px 16px 60px; }
  .item { grid-template-columns: minmax(0, 1fr); } .item .chips { grid-column: 1; grid-row: auto; justify-content: start; }
  .find kbd { display: none; }
  .toplinks { display: none; } nav .links { display: block; }
}
</style>

<div class="head">
  <div class="notice" id="notice" hidden></div>
  <header class="top">
    <button id="menu" aria-label="Show the menu">Menu</button>
    <a class="brand" href="#/"><span class="names"><b id="repo"></b><span id="org"></span></span></a>
    <div class="find">
      <input id="search" type="search" placeholder="Search tables, columns, queries, rules, code…" aria-label="Search the catalog" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
    <div class="toplinks" id="toplinks"></div>
  </header>
</div>
<div class="app">
  <aside><nav id="nav" aria-label="Catalog"></nav></aside>
  <main id="main" tabindex="-1">
    <div id="boot" class="empty">
      <p><b>The catalog is not drawn yet.</b> If this stays here, the script of the page did not run: open the file in a
      browser (Chrome, Firefox, Safari, Edge) instead of a preview pane. <code>statera docs --open</code> does that.</p>
    </div>
  </main>
</div>
<script>
// A page that cannot draw itself says why, instead of staying empty (plain old JavaScript: it must run anywhere).
window.addEventListener("error", function (event) {
  var main = document.getElementById("main"), data = document.getElementById("data");
  if (!main || !document.getElementById("boot")) return;  // something is drawn already: leave it
  var template = !data || /^\s*\/\*/.test(data.textContent);
  main.innerHTML = template
    ? '<h1 class="title">This is the template of the catalog page</h1>' +
      '<p class="lead">It is the file inside the framework, with no catalog in it. The page of a repository is made ' +
      'by a command, run in any folder of that repository:</p>' +
      '<div class="codebox"><pre>statera docs --open    # writes target/catalog.html and opens it in the browser\n' +
      'statera docs --page    # only writes it</pre></div>'
    : '<h1 class="title">The page could not be drawn</h1><p class="lead">Its script stopped with an error. Make the ' +
      'page again (<code>statera docs --page</code>); if it happens again, it is a defect of Statera: report it with ' +
      'the message below and the browser used.</p><div class="codebox"><pre id="why"></pre></div>';
  var why = document.getElementById("why");
  if (why) why.textContent = (event.message || "error") + (event.lineno ? " (line " + event.lineno + ")" : "");
});

 */\nSELECT\n  period,\n  uf_abbr,\n  records,\n  mean_value,\n  cut_date\nFROM gold.baz_uf_monthly\nWHERE\n  uf_abbr = 'uf'\nORDER BY\n  period", "columns": [{"name": "period", "type": "string"}, {"name": "uf_abbr", "type": "string"}, {"name": "records", "type": "integer"}, {"name": "mean_value", "type": "number"}, {"name": "cut_date", "type": "date"}], "tests": [{"id": "only_requested_uf", "description": "Only the requested UF, in reference-month order.", "parameters": {"uf": "RJ"}, "inputs": {"baz_uf_monthly": [{"period": "2026-02", "uf_abbr": "RJ", "records": 4, "mean_value": 210.5, "cut_date": "2026-03-10"}, {"period": "2026-01", "uf_abbr": "RJ", "records": 3, "mean_value": 190.0, "cut_date": "2026-03-10"}, {"period": "2026-01", "uf_abbr": "SP", "records": 9, "mean_value": 250.0, "cut_date": "2026-03-10"}]}, "expected": [{"period": "2026-01", "uf_abbr": "RJ", "records": 3}, {"period": "2026-02", "uf_abbr": "RJ", "records": 4}]}], "files": ["queries/foo/mean-value-by-uf/query.yaml", "queries/foo/mean-value-by-uf/mean_value_by_uf.sql", "queries/foo/mean-value-by-uf/test.yaml"]}, {"slug": "uf-series", "id": "org.example.foo-bar.query.uf-series", "title": "Series of records and value for a UF", "description": "Monthly series of records and total value for a UF, from the release table.", "limitations": "Figures from the last processed cut; recent reference months still change.", "theme": "foo", "product": "bar", "bases": ["gold.bar_uf_monthly"], "frequency": "on-demand", "purpose": "on-request", "rules": ["BR-BAR-001"], "owner": "bar-team", "status": "cataloged", "version": "0.1.0", "authors": [], "classification": "broad · aggregated · none", "parameters": [{"name": "uf", "type": "uf", "required": true, "default": null, "description": "UF abbreviation", "format": "2-letter UF code, uppercase (e.g. SP)", "sql_default": "SP"}], "template": "-- Recurring query org.example.foo-bar.query.uf-series (metadata in query.yaml).\nselect\n    period,\n    uf_abbr,\n    records,\n    total_value,\n    cut_date\nfrom {{ ref('bar_uf_monthly') }}\nwhere uf_abbr = '{{ var(\"uf\", \"SP\") }}'\norder by period", "written": "-- Recurring query org.example.foo-bar.query.uf-series (metadata in query.yaml).\nselect\n    period,\n    uf_abbr,\n    records,\n    total_value,\n    cut_date\nfrom gold.bar_uf_monthly\nwhere uf_abbr = 'uf'\norder by period", "formatted": "/* Recurring query org.example.foo-bar.query.uf-series (metadata in query.yaml). */\nSELECT\n  period,\n  uf_abbr,\n  records,\n  total_value,\n  cut_date\nFROM gold.bar_uf_monthly\nWHERE\n  uf_abbr = 'uf'\nORDER BY\n  period", "columns": [{"name": "period", "type": "string"}, {"name": "uf_abbr", "type": "string"}, {"name": "records", "type": "integer"}, {"name": "total_value", "type": "number"}, {"name": "cut_date", "type": "date"}], "tests": [{"id": "only_requested_uf", "description": "Only the requested UF, in reference-month order.", "parameters": {"uf": "MG"}, "inputs": {"bar_uf_monthly": [{"period": "2026-02", "uf_abbr": "MG", "records": 30, "total_value": 9000.0, "cut_date": "2026-03-10"}, {"period": "2026-01", "uf_abbr": "MG", "records": 25, "total_value": 7000.0, "cut_date": "2026-03-10"}, {"period": "2026-01", "uf_abbr": "SP", "records": 60, "total_value": 18000.0, "cut_date": "2026-03-10"}]}, "expected": [{"period": "2026-01", "uf_abbr": "MG", "records": 25}, {"period": "2026-02", "uf_abbr": "MG", "records": 30}]}], "files": ["queries/foo/uf-series/query.yaml", "queries/foo/uf-series/uf_series.sql", "queries/foo/uf-series/test.yaml"]}], "metrics": [], "rules": [{"id": "BR-BAR-001", "title": "Event reference month", "unit": "bar", "model": "bar_uf_monthly", "summary": "Each record counts in the reference month of the event date, not of the reception date. A January record received in February goes into January, which is why January changes from one edition to the next.", "html": "\u003ctable>\u003ctr>\u003cth>Field\u003c/th>\u003cth>Value\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Status\u003c/td>\u003ctd>illustrative\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Layer\u003c/td>\u003ctd>gold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Implementation\u003c/td>\u003ctd>\u003ccode>bar_uf_monthly\u003c/code> (dbt)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GSBPM\u003c/td>\u003ctd>5.7 Calculate aggregates\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>Definition\u003c/h3>\n\u003cp>Each record counts in the reference month of the \u003cb>event date\u003c/b>, not of the reception date. A January record received in February goes into January, which is why January changes from one edition to the next.\u003c/p>", "cases": [{"id": "counts_in_event_month", "description": "Two January records (one received in February) and one February record, in SP.", "inputs": {"int_bar__records": [{"record_id": "R1", "uf_id": 35, "period": "2026-01", "value": 100.0, "cut_date": "2026-03-10"}, {"record_id": "R2", "uf_id": 35, "period": "2026-01", "value": 300.0, "cut_date": "2026-03-10"}, {"record_id": "R3", "uf_id": 35, "period": "2026-02", "value": 50.0, "cut_date": "2026-03-10"}], "ref_uf": [{"uf_id": 35, "uf_abbr": "SP", "uf_name": "São Paulo"}]}, "expected": [{"period": "2026-01", "uf_abbr": "SP", "records": 2, "total_value": 400.0, "mean_value": 200.0}, {"period": "2026-02", "uf_abbr": "SP", "records": 1, "total_value": 50.0, "mean_value": 50.0}]}], "requires": [], "path": "products/bar/5-process/rules/BR-BAR-001-event-month/rule.md"}, {"id": "BR-BAR-002", "title": "Change over the previous month", "unit": "bar", "model": "bar_uf_monthly_change", "summary": "The change for a UF in a reference month is (records / records in the previous month − 1) × 100, rounded to two decimal places. In the UF's first reference month there is no previous month: the change is empty, not zero.", "html": "\u003ctable>\u003ctr>\u003cth>Field\u003c/th>\u003cth>Value\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Status\u003c/td>\u003ctd>illustrative\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Layer\u003c/td>\u003ctd>gold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Implementation\u003c/td>\u003ctd>\u003ccode>bar_uf_monthly_change\u003c/code> (dbt \u003cb>Python\u003c/b> model, pandas)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GSBPM\u003c/td>\u003ctd>5.7 Calculate aggregates\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>Definition\u003c/h3>\n\u003cp>The change for a UF in a reference month is \u003ccode>(records / records in the previous month − 1) × 100\u003c/code>, rounded to two decimal places. In the UF's first reference month there is no previous month: the change is empty, not zero.\u003c/p>\n\u003cp>The cases of this rule run through the framework (\u003ccode>statera rules test\u003c/code>), calling the model's pure function; dbt only runs \u003ci>unit tests\u003c/i> on SQL models.\u003c/p>", "cases": [{"id": "change_and_empty_first_month", "description": "SP goes from 50 to 60 records (+20%); the first reference month has no change.", "inputs": {"bar_uf_monthly": [{"period": "2026-01", "uf_abbr": "SP", "cut_date": "2026-03-10", "records": 50}, {"period": "2026-02", "uf_abbr": "SP", "cut_date": "2026-03-10", "records": 60}, {"period": "2026-01", "uf_abbr": "RJ", "cut_date": "2026-03-10", "records": 20}]}, "expected": [{"period": "2026-01", "uf_abbr": "SP", "change_pct": null}, {"period": "2026-02", "uf_abbr": "SP", "change_pct": 20.0}, {"period": "2026-01", "uf_abbr": "RJ", "change_pct": null}]}], "requires": [], "path": "products/bar/5-process/rules/BR-BAR-002-monthly-change/rule.md"}, {"id": "BR-BAZ-001", "title": "Mean value by UF (legacy SPSS script)", "unit": "baz", "model": "baz_uf_monthly", "summary": "Mean value = total value / number of records, by UF and reference month, rounded to two decimal places.", "html": "\u003ctable>\u003ctr>\u003cth>Field\u003c/th>\u003cth>Value\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Status\u003c/td>\u003ctd>illustrative; parity with SPSS in progress\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Layer\u003c/td>\u003ctd>gold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Implementation\u003c/td>\u003ctd>\u003ccode>baz_uf_monthly.sps\u003c/code> (legacy SPSS), run by GNU PSPP in the Python model \u003ccode>baz_uf_monthly\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GSBPM\u003c/td>\u003ctd>5.7 Calculate aggregates\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>Definition\u003c/h3>\n\u003cp>Mean value = total value / number of records, by UF and reference month, rounded to two decimal places.\u003c/p>\n\u003ch3>Execution\u003c/h3>\n\u003cp>The cases run through the framework (\u003ccode>statera rules test\u003c/code>) and \u003cb>require GNU PSPP\u003c/b>: where it is not installed, they are reported as \"not run\"; the CI installs it and requires them. PSPP is not SPSS: before the result replaces the SPSS one, equivalence is certified (the same cut in both, cell-by-cell comparison).\u003c/p>", "cases": [{"id": "mean_by_uf_and_month", "description": "Two SP records in January (10 and 30) give a mean of 20; one RJ record (5) gives 5.", "inputs": {"int_baz__records": [{"period": "2026-01", "uf_id": 35, "value": 10.0}, {"period": "2026-01", "uf_id": 35, "value": 30.0}, {"period": "2026-01", "uf_id": 33, "value": 5.0}], "ref_uf": [{"uf_id": 35, "uf_abbr": "SP"}, {"uf_id": 33, "uf_abbr": "RJ"}]}, "expected": [{"period": "2026-01", "uf_abbr": "SP", "records": 2, "mean_value": 20.0}, {"period": "2026-01", "uf_abbr": "RJ", "records": 1, "mean_value": 5.0}]}], "requires": ["pspp"], "path": "products/baz/5-process/rules/BR-BAZ-001-legacy-mean-value/rule.md"}, {"id": "BR-BAZ-002", "title": "Median value by UF (legacy R script)", "unit": "baz", "model": "baz_uf_monthly_median", "summary": "Median value of records by UF and reference month, rounded to two decimal places. With an even number of records, the mean of the two middle values (like R's median).", "html": "\u003ctable>\u003ctr>\u003cth>Field\u003c/th>\u003cth>Value\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Status\u003c/td>\u003ctd>illustrative; parity with the legacy code in progress\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Layer\u003c/td>\u003ctd>gold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Implementation\u003c/td>\u003ctd>\u003ccode>baz_uf_monthly_median.R\u003c/code> (legacy R), run by Rscript in the Python model \u003ccode>baz_uf_monthly_median\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GSBPM\u003c/td>\u003ctd>5.7 Calculate aggregates\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>Definition\u003c/h3>\n\u003cp>Median value of records by UF and reference month, rounded to two decimal places. With an even number of records, the mean of the two middle values (like R's \u003ccode>median\u003c/code>).\u003c/p>\n\u003ch3>Execution\u003c/h3>\n\u003cp>The cases run through the framework (\u003ccode>statera rules test\u003c/code>) and \u003cb>require R\u003c/b>: where it is not installed, they are reported as \"not run\"; the CI installs it and requires them.\u003c/p>", "cases": [{"id": "median_odd_and_even", "description": "Three SP records (10, 30, 20) give a median of 20; two RJ records (5, 8) give 6.5.", "inputs": {"int_baz__records": [{"period": "2026-01", "uf_id": 35, "value": 10.0}, {"period": "2026-01", "uf_id": 35, "value": 30.0}, {"period": "2026-01", "uf_id": 35, "value": 20.0}, {"period": "2026-01", "uf_id": 33, "value": 5.0}, {"period": "2026-01", "uf_id": 33, "value": 8.0}], "ref_uf": [{"uf_id": 35, "uf_abbr": "SP"}, {"uf_id": 33, "uf_abbr": "RJ"}]}, "expected": [{"period": "2026-01", "uf_abbr": "SP", "median_value": 20.0}, {"period": "2026-01", "uf_abbr": "RJ", "median_value": 6.5}]}], "requires": ["r"], "path": "products/baz/5-process/rules/BR-BAZ-002-legacy-median/rule.md"}], "recipes": [], "code": [{"path": "products/bar/5-process/models/intermediate/bar/int_bar__records.sql", "name": "int_bar__records.sql", "unit": "bar", "role": "model", "language": "sql", "about": "foo records at the cut pinned by the edition (the cut filter is in the source product's staging).", "table": "silver.int_bar__records", "text": "-- foo records at the cut pinned by the edition (the cut filter is in the source product's staging).\n\nselect\n    record_id,\n    uf_id,\n    period,\n    value,\n    cut_date\nfrom {{ ref('stg_foo__records') }}"}, {"path": "products/bar/5-process/models/marts/bar/bar_uf_monthly.sql", "name": "bar_uf_monthly.sql", "unit": "bar", "role": "model", "language": "sql", "about": "Release table: records and value by UF and reference month.", "table": "gold.bar_uf_monthly", "text": "-- Release table: records and value by UF and reference month.\n--   BR-BAR-001  a record counts in the reference month of the EVENT, not of reception\n\n{{ config(meta={'rules': ['BR-BAR-001'], 'gsbpm': '5.7'}) }}\n\nwith records as (\n\n    select *\n    from {{ ref('int_bar__records') }}\n    where period \u003c= '{{ var(\"period\") }}'\n\n),\n\nufs as (\n\n    select * from {{ ref('ref_uf') }}\n\n)\n\nselect\n    records.period,\n    ufs.uf_abbr,\n    ufs.uf_name,\n    cast('{{ var(\"cut_date\") }}' as date) as cut_date,\n    cast(count(*) as bigint) as records,\n    cast(sum(records.value) as decimal(14, 2)) as total_value,\n    cast(avg(records.value) as decimal(12, 2)) as mean_value\nfrom records\ninner join ufs on records.uf_id = ufs.uf_id\ngroup by records.period, ufs.uf_abbr, ufs.uf_name\norder by records.period, ufs.uf_abbr"}, {"path": "products/bar/5-process/models/marts/bar/bar_uf_monthly_change.py", "name": "bar_uf_monthly_change.py", "unit": "bar", "role": "model", "language": "python", "about": "Change in records by UF relative to the previous reference month (dbt Python model, with pandas).", "table": "gold.bar_uf_monthly_change", "text": "\"\"\"Change in records by UF relative to the previous reference month (dbt Python model, with pandas).\n\n  BR-BAR-002  percentage change over the previous month of the same UF; empty in the first reference month\n\nThe rule lives in a pure function, `transform(inputs, variables)`, which the framework tests with the\nrule's cases (statera rules test). `model()` only wires the function into dbt.\n\"\"\"\n\nimport pandas as pd\n\n\ndef transform(inputs: dict[str, pd.DataFrame], variables: dict) -> pd.DataFrame:\n    df = inputs[\"bar_uf_monthly\"][[\"period\", \"uf_abbr\", \"cut_date\", \"records\"]].copy()\n    df = df.sort_values([\"uf_abbr\", \"period\"]).reset_index(drop=True)\n    df[\"cut_date\"] = pd.to_datetime(df[\"cut_date\"]).dt.date  # pandas returns TIMESTAMP; the contract promises DATE\n    # BR-BAR-002\n    df[\"previous_month_records\"] = df.groupby(\"uf_abbr\")[\"records\"].shift(1)\n    df[\"change_pct\"] = ((df[\"records\"] / df[\"previous_month_records\"] - 1) * 100).round(2)\n    return df\n\n\ndef model(dbt, session):\n    dbt.config(materialized=\"table\", meta={\"rules\": [\"BR-BAR-002\"], \"gsbpm\": \"5.7\"})\n    return transform({\"bar_uf_monthly\": dbt.ref(\"bar_uf_monthly\").df()}, {})"}, {"path": "products/bar/6-analyse/checks.py", "name": "checks.py", "unit": "bar", "role": "check", "language": "python", "about": "bar's own edition checks (statera.extend.Check), named by the controls in controls.yaml.", "table": null, "text": "\"\"\"bar's own edition checks (statera.extend.Check), named by the controls in controls.yaml.\n\nEach check has its cases in check-cases/\u003cCheck>.yaml, run by `statera validate` and `statera check`.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom statera.extend import Check, CheckContext, CheckResult\n\n\nclass NoRecordsLost(Check):\n    \"\"\"Records of the Foo System only arrive late, they never leave: for every key already released in the\n    previous edition, the measure must not decrease. A decrease means records lost between two foo cuts.\n\n    Parameters (controls.yaml): `port`, `key` (columns), `measure` (default `records`).\"\"\"\n\n    severity = \"error\"\n\n    def evaluate(self, ctx: CheckContext) -> CheckResult:\n        port, key = ctx.params[\"port\"], list(ctx.params[\"key\"])\n        measure = ctx.params.get(\"measure\", \"records\")\n        previous = ctx.previous(port)\n        if previous is None or previous.empty:\n            return CheckResult.ok(\"no previous edition to compare with\")\n        current = ctx.current(port)\n        both = previous[[*key, measure]].merge(\n            current[[*key, measure]], on=key, how=\"left\", suffixes=(\"_previous\", \"_current\")\n        )\n        both[f\"{measure}_current\"] = both[f\"{measure}_current\"].fillna(0)\n        lost = both[both[f\"{measure}_current\"] \u003c both[f\"{measure}_previous\"]]\n        if lost.empty:\n            return CheckResult.ok(f\"{len(both)} key(s) released before: none lost {measure}\")\n        examples = \"; \".join(\n            f\"{'/'.join(str(row[k]) for k in key)}: {row[f'{measure}_previous']:g} -> {row[f'{measure}_current']:g}\"\n            for _, row in lost.head(3).iterrows()\n        )\n        return CheckResult.fail(f\"{len(lost)} key(s) lost {measure} since the previous edition: {examples}\", rows=lost)"}, {"path": "products/baz/5-process/models/intermediate/baz/int_baz__records.sql", "name": "int_baz__records.sql", "unit": "baz", "role": "model", "language": "sql", "about": "foo records at the cut pinned by the edition, with only what the legacy script reads.", "table": "silver.int_baz__records", "text": "-- foo records at the cut pinned by the edition, with only what the legacy script reads.\n\nselect\n    period,\n    uf_id,\n    cast(value as double) as value\nfrom {{ ref('stg_foo__records') }}"}, {"path": "products/baz/5-process/models/marts/baz/baz_uf_monthly.py", "name": "baz_uf_monthly.py", "unit": "baz", "role": "model", "language": "python", "about": "Baz: the legacy SPSS script `baz_uf_monthly.sps`, run by GNU PSPP inside a dbt Python model.", "table": "gold.baz_uf_monthly", "text": "\"\"\"Baz: the legacy SPSS script `baz_uf_monthly.sps`, run by GNU PSPP inside a dbt Python model.\n\n  BR-BAZ-001  mean value by UF and reference month (in the legacy script)\n\nPython only prepares the inputs, calls PSPP and adds what the legacy code did not (UF abbreviation and\ncut-off date). The rule stays in the `.sps` file, not rewritten. The rule's cases run through the framework\n(`statera rules test`) where PSPP is available; the CI installs it and requires them.\n\"\"\"\n\nfrom pathlib import Path\n\nimport pandas as pd\nfrom statera.legacy import pspp\n\nSYNTAX = Path(__file__).with_name(\"baz_uf_monthly.sps\")\n\n\ndef transform(inputs: dict[str, pd.DataFrame], variables: dict) -> pd.DataFrame:\n    records = inputs[\"int_baz__records\"][[\"period\", \"uf_id\", \"value\"]].astype({\"value\": float})\n    aggregated = pspp.run(SYNTAX, {\"records\": records}, output=\"result\")\n    aggregated = aggregated.astype({\"uf_id\": int, \"records\": int})\n    ufs = inputs[\"ref_uf\"][[\"uf_id\", \"uf_abbr\"]].astype({\"uf_id\": int})\n    output = aggregated.merge(ufs, on=\"uf_id\", how=\"left\")\n    output[\"cut_date\"] = pd.to_datetime(variables[\"cut_date\"]).date()\n    output[\"mean_value\"] = output[\"mean_value\"].round(2)\n    return output[[\"period\", \"uf_abbr\", \"cut_date\", \"records\", \"mean_value\"]]\n\n\ndef model(dbt, session):\n    dbt.config(materialized=\"table\", meta={\"rules\": [\"BR-BAZ-001\"], \"gsbpm\": \"5.7\", \"legacy\": \"spss\"})\n    # dbt reads the dbt.ref() calls in the code to build the lineage: the names must be literals\n    inputs = {\"int_baz__records\": dbt.ref(\"int_baz__records\").df(), \"ref_uf\": dbt.ref(\"ref_uf\").df()}\n    return transform(inputs, {\"cut_date\": dbt.config.get(\"cut_date\")})"}, {"path": "products/baz/5-process/models/marts/baz/baz_uf_monthly.sps", "name": "baz_uf_monthly.sps", "unit": "baz", "role": "model", "language": "spss", "about": "LEGACY SPSS script (illustrative): mean value of records by UF and reference month.", "table": "gold.baz_uf_monthly", "text": "* LEGACY SPSS script (illustrative): mean value of records by UF and reference month.\n* Adapted to run from the repository: only the file paths became FILE HANDLEs, which the\n* framework defines (records = input; result = output). The rest is the original syntax.\n*   BR-BAZ-001  mean value = total value / number of records, by UF and reference month.\n\nGET FILE=records.\nAGGREGATE OUTFILE=* /BREAK=period uf_id /records=N /total_value=SUM(value).\nCOMPUTE mean_value = total_value / records.\nFORMATS records (F8.0) total_value mean_value (F12.2).\nSORT CASES BY period uf_id.\nSAVE OUTFILE=result."}, {"path": "products/baz/5-process/models/marts/baz/baz_uf_monthly_median.R", "name": "baz_uf_monthly_median.R", "unit": "baz", "role": "model", "language": "r", "about": "LEGACY R script (illustrative): median value of records by UF and reference month.", "table": "gold.baz_uf_monthly_median", "text": "# LEGACY R script (illustrative): median value of records by UF and reference month.\n# Adapted to run from the repository: only the file paths became the variables that the\n# framework defines at the start (inputs$records = input; output = output file). Base R only.\n#   BR-BAZ-002  median value by UF and reference month\n\nrecords \u003c- readRDS(inputs$records)\nresult \u003c- aggregate(value ~ period + uf_id, data = records, FUN = median)\nnames(result)[names(result) == \"value\"] \u003c- \"median_value\"\nresult \u003c- result[order(result$period, result$uf_id), ]\nsaveRDS(result, output)"}, {"path": "products/baz/5-process/models/marts/baz/baz_uf_monthly_median.py", "name": "baz_uf_monthly_median.py", "unit": "baz", "role": "model", "language": "python", "about": "Baz: the legacy R script `baz_uf_monthly_median.R`, run by Rscript inside a dbt Python model.", "table": "gold.baz_uf_monthly_median", "text": "\"\"\"Baz: the legacy R script `baz_uf_monthly_median.R`, run by Rscript inside a dbt Python model.\n\n  BR-BAZ-002  median value by UF and reference month (in the legacy script)\n\nPython only prepares the inputs, calls R and adds what the legacy code did not (UF abbreviation and\ncut-off date). The rule stays in the `.R` file, not rewritten. The rule's cases run through the framework\n(`statera rules test`) where R is available; the CI installs it and requires them.\n\"\"\"\n\nfrom pathlib import Path\n\nimport pandas as pd\nfrom statera.legacy import r\n\nSCRIPT = Path(__file__).with_name(\"baz_uf_monthly_median.R\")\n\n\ndef transform(inputs: dict[str, pd.DataFrame], variables: dict) -> pd.DataFrame:\n    records = inputs[\"int_baz__records\"][[\"period\", \"uf_id\", \"value\"]].astype({\"value\": float})\n    median = r.run(SCRIPT, {\"records\": records}, output=\"result\")\n    median = median.astype({\"uf_id\": int})\n    ufs = inputs[\"ref_uf\"][[\"uf_id\", \"uf_abbr\"]].astype({\"uf_id\": int})\n    output = median.merge(ufs, on=\"uf_id\", how=\"left\")\n    output[\"cut_date\"] = pd.to_datetime(variables[\"cut_date\"]).date()\n    output[\"median_value\"] = output[\"median_value\"].round(2)\n    return output[[\"period\", \"uf_abbr\", \"cut_date\", \"median_value\"]]\n\n\ndef model(dbt, session):\n    dbt.config(materialized=\"table\", meta={\"rules\": [\"BR-BAZ-002\"], \"gsbpm\": \"5.7\", \"legacy\": \"r\"})\n    # dbt reads the dbt.ref() calls in the code to build the lineage: the names must be literals\n    inputs = {\"int_baz__records\": dbt.ref(\"int_baz__records\").df(), \"ref_uf\": dbt.ref(\"ref_uf\").df()}\n    return transform(inputs, {\"cut_date\": dbt.config.get(\"cut_date\")})"}, {"path": "products/foo/5-process/models/staging/foo/stg_foo__records.sql", "name": "stg_foo__records.sql", "unit": "foo", "role": "model", "language": "sql", "about": "Foo System records at the cut pinned by the run, with standardized names and types.", "table": "silver.stg_foo__records", "text": "-- Foo System records at the cut pinned by the run, with standardized names and types.\n\nwith origem as (\n\n    select *\n    from {{ source('foo', 'foo_records') }}\n    where {{ statera.at_cut('received_at', 'foo_records') }}\n\n)\n\nselect\n    record_id,\n    person_id,\n    cast(uf_id as integer) as uf_id,\n    cast(event_date as date) as event_date,\n    strftime(cast(event_date as date), '%Y-%m') as period,\n    received_at,\n    cast(value as decimal(12, 2)) as value,\n    batch,\n    cast('{{ var(\"cut_date\") }}' as date) as cut_date\nfrom origem"}], "commands": [{"name": "copilot", "summary": "ask in plain language: a local model finds the command (or writes the SQL) and runs it if you agree", "help": "usage: statera copilot [-h] [--yes] [--model MODEL] [--output OUTPUT] [--engine ENGINE]\n                       [--verbose]\n                       [question ...]\n\npositional arguments:\n  question         the question; without it, a conversation starts\n\noptions:\n  -h, --help       show this help message and exit\n  --yes            runs what only reads (queries, status…) without asking\n  --model MODEL    local Ollama model (default: [copilot] model, else qwen2.5-coder:7b)\n  --output OUTPUT  folder for result.csv and query.sql of an ad hoc SQL answer\n  --engine ENGINE  where to read the data: `local`, a DuckDB file or URL, or an engine URL\n                   (default: statera.toml)\n  --verbose        shows the model's reasoning at each step"}, {"name": "cuts", "summary": "cuts released by the internal products", "help": "usage: statera cuts [-h] [--product PRODUCT]\n\noptions:\n  -h, --help         show this help message and exit\n  --product PRODUCT"}, {"name": "doctor", "summary": "checks the computer and the repository; says how to fix each problem", "help": "usage: statera doctor [-h]\n\noptions:\n  -h, --help  show this help message and exit"}, {"name": "evaluate", "summary": "quality indicators of the published editions (phase 8)", "help": "usage: statera evaluate [-h] [--product PRODUCT]\n\noptions:\n  -h, --help         show this help message and exit\n  --product PRODUCT"}, {"name": "metric", "summary": "computes an official metric", "help": "usage: statera metric [-h] [--by BY] [--period PERIOD] [--from FROM_] [--to UNTIL]\n                      [--filter FILTER_] [--engine ENGINE]\n                      name\n\npositional arguments:\n  name\n\noptions:\n  -h, --help        show this help message and exit\n  --by BY           comma-separated dimensions\n  --period PERIOD\n  --from FROM_\n  --to UNTIL\n  --filter FILTER_  dimension=value (repeatable)\n  --engine ENGINE   where to read the data: `local`, a DuckDB file or URL, or an engine URL\n                    (default: statera.toml)"}, {"name": "query", "summary": "cataloged recurring queries", "help": "usage: statera query [-h] [--param PARAM] [--output OUTPUT] [--engine ENGINE]\n                     {list,show,run,test} [id]\n\npositional arguments:\n  {list,show,run,test}  show: the SQL that run executes; `statera query show \u003cid> --help` explains\n                        the query's parameters\n  id\n\noptions:\n  -h, --help            show this help message and exit\n  --param PARAM         name=value (repeatable)\n  --output OUTPUT       folder for result.csv and the provenance datapackage.json\n  --engine ENGINE       where to read the data: `local`, a DuckDB file or URL, or an engine URL\n                        (default: statera.toml)"}, {"name": "recipes", "summary": "lists or runs the recipes", "help": "usage: statera recipes [-h] [--show] [--engine ENGINE] {list,test}\n\npositional arguments:\n  {list,test}\n\noptions:\n  -h, --help       show this help message and exit\n  --show           shows the output of each recipe\n  --engine ENGINE  where to read the data: `local`, a DuckDB file or URL, or an engine URL\n                   (default: statera.toml)"}, {"name": "status", "summary": "where the editions are: all products (latest edition, and the next one the calendar expects), one product (every edition), or one edition", "help": "usage: statera status [-h] [--product PRODUCT] [--period PERIOD] [--cut-date CUT_DATE]\n\noptions:\n  -h, --help           show this help message and exit\n  --product PRODUCT    without it: every product, latest edition or cut\n  --period PERIOD      with --product: one edition in detail (tasks, alerts)\n  --cut-date CUT_DATE  with --product: one cut of an internal product"}, {"name": "tasks", "summary": "the human tasks of every open edition: who (which role) has to do what, since when, and the command that takes each one on", "help": "usage: statera tasks [-h] [--product PRODUCT] [--role {data-team,bar-team,curation,dpo}] [--all]\n\noptions:\n  -h, --help            show this help message and exit\n  --product PRODUCT     only the editions of this product (without it: every product)\n  --role {data-team,bar-team,curation,dpo}\n                        only the tasks of this role, an id of governance/roles.yaml (without it:\n                        every role)\n  --all                 also the editions done: what was completed, when"}], "lineage": {"svg": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1080 794\" width=\"1080\" height=\"794\" font-family=\"Helvetica, Arial, sans-serif\" role=\"img\" aria-label=\"Data lineage\">\n\u003cdefs>\u003cmarker id=\"s\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#8A8A8A\"/>\u003c/marker>\u003c/defs>\n\u003crect width=\"100%\" height=\"100%\" fill=\"#FFFFFF\"/>\n\u003ctext x=\"30\" y=\"38\" font-size=\"18\" font-weight=\"bold\" fill=\"#1F1F1F\">Data lineage\u003c/text>\n\u003crect x=\"30\" y=\"58\" width=\"22\" height=\"14\" rx=\"3\" fill=\"#ECEFF4\" stroke=\"#4C566A\"/>\u003ctext x=\"60\" y=\"69\" font-size=\"12\" fill=\"#333\">Source systems\u003c/text>\n\u003crect x=\"200\" y=\"58\" width=\"22\" height=\"14\" rx=\"3\" fill=\"#F6E3D3\" stroke=\"#9C5B2E\"/>\u003ctext x=\"230\" y=\"69\" font-size=\"12\" fill=\"#333\">Bronze\u003c/text>\n\u003crect x=\"370\" y=\"58\" width=\"22\" height=\"14\" rx=\"3\" fill=\"#E1ECF7\" stroke=\"#2F6497\"/>\u003ctext x=\"400\" y=\"69\" font-size=\"12\" fill=\"#333\">Ref " fill=\"#1F1F1F\">baz_uf_monthly\u003c/text>\n\u003ctext x=\"780.0\" y=\"533\" font-size=\"10\" text-anchor=\"middle\" fill=\"#9A7B0A\">broad · aggregated · ODCS\u003c/text>\n\u003crect x=\"432.5\" y=\"590\" width=\"215\" height=\"48\" rx=\"7\" fill=\"#FBF0C9\" stroke=\"#9A7B0A\" stroke-width=\"1.4\"/>\n\u003ctext x=\"540.0\" y=\"610\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#1F1F1F\">bar_uf_monthly_change\u003c/text>\n\u003ctext x=\"540.0\" y=\"625\" font-size=\"10\" text-anchor=\"middle\" fill=\"#9A7B0A\">broad · aggregated · ODCS\u003c/text>\n\u003crect x=\"192.5\" y=\"682\" width=\"215\" height=\"48\" rx=\"7\" fill=\"#EAE2F5\" stroke=\"#5E3C99\" stroke-width=\"1.4\"/>\n\u003ctext x=\"300.0\" y=\"702\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#1F1F1F\">Bar — monthly release (spreadshe…\u003c/text>\n\u003crect x=\"432.5\" y=\"682\" width=\"215\" height=\"48\" rx=\"7\" fill=\"#EAE2F5\" stroke=\"#5E3C99\" stroke-width=\"1.4\"/>\n\u003ctext x=\"540.0\" y=\"702\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#1F1F1F\">query: uf_series\u003c/text>\n\u003crect x=\"672.5\" y=\"682\" width=\"215\" height=\"48\" rx=\"7\" fill=\"#EAE2F5\" stroke=\"#5E3C99\" stroke-width=\"1.4\"/>\n\u003ctext x=\"780.0\" y=\"702\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#1F1F1F\">query: mean_value_by_uf\u003c/text>\n\u003c/svg>", "missing": null}, "validators": {"period": "^\\d{4}-(0[1-9]|1[0-2])$", "ibge-code": "^\\d{7}$", "uf": "^[A-Z]{2}$", "integer": "^-?\\d+$", "short-text": "^[\\w\\s.,-]{1,60}$", "cut": "^(latest|\\d{4}-\\d{2}-\\d{2})$"}, "examples": {"period": "2026-06", "date": "2026-06-30", "cut": "latest", "ibge-code": "3550308", "uf": "SP", "integer": "1", "short-text": "text"}, "theme": {}}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const OPEN = "", CLOSE = "", MISS = "", MISS_END = "";
const main = document.getElementById("main"), nav = document.getElementById("nav"), search = document.getElementById("search");
const TH = D.theme || {}, NAME = TH.name || D.project.name;  // the institution's own name, logo, notice and links

// ---- small helpers ---------------------------------------------------------------------------------
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fold = t => String(t ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const href = (kind, id) => `#/${kind}${id != null && id !== "" ? "/" + encodeURIComponent(id) : ""}`;
const link = (kind, id, text) => `<a href="${href(kind, id)}">${esc(text ?? id)}</a>`;
const chip = (label, value, cls = "") => value || value === 0 ? `<span class="chip ${cls}">${label ? `<i>${esc(label)}</i> ` : ""}${esc(value)}</span>` : "";
const facts = rows => { const shown = rows.filter(r => r && r[1]);
  return shown.length ? `<dl class="facts">${shown.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>` : ""; };
const sec = (title, note = "") => `<h2 class="sec">${esc(title)}${note ? `<small>${note}</small>` : ""}</h2>`;
const index = (list, key) => Object.fromEntries(list.map(x => [x[key], x]));
const Q = index(D.queries, "slug"), T = index(D.tables, "name"), P = index(D.products, "name"), R = index(D.rules, "id"),
  M = index(D.metrics, "name"), C = index(D.code, "path"), RC = index(D.recipes, "path");
const stem = name => name.replace(/\.[^.]+$/, "");
const tableLink = n => T[n] ? link("tables", n) : `<span class="mono">${esc(n)}</span>`;
const productLink = n => P[n] ? link("products", n, P[n].title) : esc(n);
const ruleLink = n => R[n] ? link("rules", n, `${n} ${R[n].title}`) : esc(n);
const links = (list, one) => list.map(one).join("<br>");
const LANGUAGE = {sql: "SQL", python: "Python", r: "R", spss: "SPSS / PSPP", sh: "Terminal"};
const lines = text => text.join("\n");
const tick = text => esc(text).replace(/`([^`]+)`/g, "<code>$1</code>");  // prose from the repository: `code` as code

// what belongs together, worked out once from what each thing declares
const queriesOf = t => D.queries.filter(q => q.bases.includes(t.name));
const metricsOf = t => D.metrics.filter(m => m.sources.some(s => s.table === t.name));
const modelOf = t => t.model || t.name.split(".").pop();
const rulesOfTable = t => D.rules.filter(r => r.model === modelOf(t));
const codeOfTable = t => D.code.filter(c => c.table === t.name);
const codeOfRule = r => D.code.filter(c => c.role === "model" && stem(c.name) === r.model);
const tableOfContract = id => D.tables.find(t => t.contract === id);

// ---- colouring: one small tokenizer for the languages a repository holds ---------------------------
const WORDS = {
  sql: "select from where group by order having join left right inner outer full cross on as and or not in is null case when then else end with union all distinct limit offset over partition qualify between like asc desc cast count sum avg min max median row_number coalesce using exists interval true false",
  python: "def return import from as if elif else for while in not and or is None True False with try except finally raise class lambda pass yield",
  r: "function if else for while in return library require TRUE FALSE NULL NA next break",
  spss: "get file data aggregate outfile break compute formats sort cases by save select if execute recode into variables type delimiters qualifier firstcase frequencies descriptives list match files table",
  sh: "",
};
const COMMENT = {sql: "--[^\\n]*|/\\*[\\s\\S]*?\\*/", python: "#[^\\n]*", r: "#[^\\n]*", spss: "^[ \\t]*\\*[^\\n]*", sh: "#[^\\n]*"};
function paint(text, lang) {
  lang = WORDS[lang] == null ? "sh" : lang;
  const foldCase = lang === "sql" || lang === "spss", words = new Set(WORDS[lang].split(" "));
  const re = new RegExp(`(${COMMENT[lang]})|('(?:[^'\\n]|'')*'|"(?:[^"\\\\\\n]|\\\\.)*")|(\\b\\d+(?:\\.\\d+)?\\b)|([A-Za-z_][A-Za-z0-9_]*)`, "gm");
  const plain = t => esc(t)
    .replace(/\{\{.*?\}\}|\{%.*?%\}/g, j => `<span class="j">${j}</span>`)
    .replace(new RegExp(`${OPEN}([^${CLOSE}]*)${CLOSE}`, "g"), `<mark class="fill" title="a parameter's value">$1</mark>`)
    .replace(new RegExp(`${MISS}([^${MISS_END}]*)${MISS_END}`, "g"), `<mark class="miss" title="not filled in">$1</mark>`);
  let out = "", at = 0, m;
  while ((m = re.exec(text))) {
    out += plain(text.slice(at, m.index));
    const [tok, com, str, num, word] = m;
    if (com) out += `<span class="c">${plain(tok)}</span>`;
    else if (str) out += `<span class="s">${plain(tok)}</span>`;
    else if (num) out += `<span class="n">${tok}</span>`;
    else out += words.has(foldCase ? word.toLowerCase() : word) ? `<span class="k">${tok}</span>` : esc(tok);
    at = m.index + tok.length;
  }
  return out + plain(text.slice(at));
}
const bare = text => text.replace(/[-]/g, "");

function copy(text, button) {
  const done = () => { button.textContent = "Copied"; button.classList.add("done");
    setTimeout(() => { button.textContent = "Copy"; button.classList.remove("done"); }, 1400); };
  const old = () => { const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select();
    try { document.execCommand("copy"); done(); } finally { t.remove(); } };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, old); else old();
}

/** A box of code with tabs and a copy button. tabs: [{name, lang, text, blocked?, why?}] */
function codebox(host, tabs, options = "") {
  let on = Math.max(0, tabs.findIndex(t => t.name === host.dataset.tab));
  host.className = "codebox";
  host.innerHTML = `<div class="bar" role="tablist">${tabs.map((t, i) => `<button class="tab${i === on ? " on" : ""}" role="tab" data-i="${i}">${esc(t.name)}</button>`).join("")}
    <span class="gap"></span>${options}<button class="copy">Copy</button></div><pre></pre><div class="why" hidden></div>`;
  const show = () => {
    const t = tabs[on], button = host.querySelector(".copy"), why = host.querySelector(".why");
    host.querySelector("pre").innerHTML = paint(t.text, t.lang);
    button.disabled = !!t.blocked; button.title = t.blocked || "";
    why.hidden = !(t.blocked || t.why); why.textContent = t.blocked || t.why || ""; why.classList.toggle("stop", !!t.blocked);
  };
  host.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    on = +b.dataset.i; host.dataset.tab = tabs[on].name;
    host.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b)); show();
  });
  host.querySelector(".copy").onclick = e => copy(bare(tabs[on].text), e.currentTarget);
  show();
}
/** A drawing (lineage, process) at its own size, with a way to see it whole. */
const figure = (svg, label) => `<div class="figtools"><button class="ghost" data-fit>Fit to the page</button></div>
  <div class="figure" role="img" aria-label="${esc(label)}">${svg}</div>`;
function wireFigures() {
  main.querySelectorAll("[data-fit]").forEach(b => b.onclick = () => {
    const fit = b.parentElement.nextElementSibling.classList.toggle("fit"); b.textContent = fit ? "Actual size" : "Fit to the page"; });
}
const cell = v => v == null ? `<td class="m null">null</td>` : `<td class="m${typeof v === "number" ? " r" : ""}">${esc(v)}</td>`;
const grid = rows => { const cols = [...new Set(rows.flatMap(r => Object.keys(r)))];
  return rows.length ? `<div class="scroll"><table><tr>${cols.map(c => `<th class="m">${esc(c)}</th>`).join("")}</tr>${rows.map(r =>
    `<tr>${cols.map(c => cell(r[c])).join("")}</tr>`).join("")}</table></div>` : `<p class="ident">no rows</p>`; };
const inputsOf = c => Object.entries(c.inputs || {}).map(([name, rows]) =>
  `<details><summary>input: ${esc(name)} (${rows.length} row${rows.length === 1 ? "" : "s"})</summary>${grid(rows)}</details>`).join("");

// ---- queries: the form fills the SQL as `statera query show` would ----------------------------------
const INPUT = {period: "month", date: "date"};
const PERIOD = /^\d{4}-(0[1-9]|1[0-2])$/;
function pattern(type) {
  const source = D.validators[type];
  if (!source) return null;
  try { return new RegExp(source.replace(/\\w/g, "\\p{L}\\p{N}_"), "u"); } catch { return new RegExp(source); }  // \w as Python reads it
}
function valid(p, value) {
  if (p.type === "date") return /^\d{4}-\d{2}-\d{2}$/.test(value) && !isNaN(Date.parse(value));
  const re = pattern(p.type);
  return re ? re.test(value) : true;
}
/** What each parameter ends up as, by the rules of queries.validate_parameters. */
function resolved(q, values) {
  const out = {}, missing = [], wrong = [];
  for (const p of q.parameters) {
    const given = String(values[p.name] ?? "").trim() || (p.default != null ? String(p.default) : "");
    if (!given) {
      if (!p.required && p.sql_default != null) out[p.name] = {v: String(p.sql_default), implicit: true};
      else missing.push(p.name);
    } else if (!valid(p, given)) wrong.push(p.name);
    else out[p.name] = {v: given};
  }
  return {out, missing: missing.filter(n => q.parameters.find(p => p.name === n).required || q.written?.includes(OPEN + n + CLOSE)), wrong};
}
function queryTabs(q, values, formatted) {
  const {out, missing, wrong} = resolved(q, values), open = [...missing, ...wrong];
  const given = Object.entries(out).filter(([, x]) => !x.implicit);
  const blocked = open.length ? `Fill in ${open.join(", ")}: a query leaves this page only with its parameters valid by type.` : "";
  const shown = given.map(([k, x]) => `${k}=${x.v}`).join(", ") || "none";
  const flags = given.map(([k, x]) => ` --param ${k}=${/\s/.test(x.v) ? `"${x.v}"` : x.v}`).join("") + open.map(n => ` --param ${n}=${MISS}‹${n}›${MISS_END}`).join("");
  const kwargs = given.map(([k, x]) => `, ${k}="${x.v}"`).join("") + open.map(n => `, ${n}=${MISS}‹${n}›${MISS_END}`).join("");
  const folder = `out/${q.slug}`, spss = t => ({integer: "F8.0", number: "F12.2", date: "A10"}[t] || "A40");
  const tabs = [];
  if (q.written != null) {
    const body = (formatted && q.formatted ? q.formatted : q.written).replace(new RegExp(`${OPEN}([^${CLOSE}]*)${CLOSE}`, "g"),
      (_, name) => out[name] ? OPEN + out[name].v + CLOSE : MISS + "‹" + name + "›" + MISS_END);
    tabs.push({name: "SQL", lang: "sql", blocked, text: `-- ${q.id} ${q.version || ""} · parameters: ${shown}\n${body}`,
      why: "Plain SQL: ref() resolved to the engine's tables, parameters validated by type. The text `statera query show` prints."});
  }
  tabs.push({name: "As written", lang: "sql", text: q.template, why: q.written != null
    ? `As it is in the repository (${q.files[1] || ""}): a dbt analysis, with ref() and var().`
    : `This query computes part of its SQL from its parameters, so the page cannot fill it in: statera query show ${q.slug}${bare(flags)} prints the SQL.`});
  tabs.push({name: "Terminal", lang: "sh", blocked, text: lines([
      "# the result, with the disclosure control of its classification applied", `statera query run ${q.slug}${flags}`, "",
      "# to a folder: result.csv, query.sql and the provenance datapackage.json", `statera query run ${q.slug}${flags} --output ${folder}`, "",
      "# only the SQL", `statera query show ${q.slug}${flags}`])},
    {name: "Python", lang: "python", blocked, text: lines([
      "from statera.consume import catalog", "", "cat = catalog.open()", `df = cat.query("${q.slug}"${kwargs})  # a pandas DataFrame`])},
    {name: "R", lang: "r", blocked, text: lines([
      "# Statera runs the query (parameters validated, disclosure control applied); R reads the result.",
      `system2("statera", c("query", "run", "${q.slug}"${given.map(([k, x]) => `, "--param", "${k}=${x.v}"`).join("")}, "--output", "${folder}"))`,
      `df <- read.csv("${folder}/result.csv")`])},
    {name: "PSPP", lang: "spss", blocked, text: lines([
      `* First, in the terminal: statera query run ${q.slug}${bare(flags)} --output ${folder}`,
      `GET DATA /TYPE=TXT /FILE='${folder}/result.csv' /DELIMITERS=',' /QUALIFIER='"' /FIRSTCASE=2`,
      q.columns.length ? `  /VARIABLES=${q.columns.map(c => `${c.name} ${spss(c.type)}`).join("\n             ")}.` : "  /VARIABLES=<one name and format per column of result.csv>."])});
  return tabs;
}
function viewQuery(q, params) {
  const values = Object.fromEntries(params);
  let formatted = false;
  main.innerHTML = `<div class="crumb">${link("queries", "", "Recurring queries")} · theme ${esc(q.theme)}</div>
    <h1 class="title">${esc(q.title)}</h1><div class="ident">${esc(q.id)}</div>
    <div class="chips">${chip("status", q.status)}${chip("version", q.version)}${chip("owner", q.owner)}${chip("returns", q.classification)}${chip("frequency", q.frequency)}${chip("purpose", q.purpose)}</div>
    <p class="lead">${esc(q.description)}</p>
    ${q.limitations ? `<p class="note"><b>Limitations.</b> ${esc(q.limitations)}</p>` : ""}
    ${sec("Parameters")}
    ${q.parameters.length ? `<div class="form">${q.parameters.map(p => `<div class="field" data-p="${esc(p.name)}">
        <label for="p-${esc(p.name)}">${esc(p.name)} <em>${esc(p.type)} · ${p.required ? "required" : p.default != null ? "default " + esc(p.default) : "optional"}</em></label>
        <input id="p-${esc(p.name)}" type="${INPUT[p.type] || "text"}" placeholder="${esc(D.examples[p.type] || "")}" value="${esc(values[p.name] || "")}" autocomplete="off" spellcheck="false">
        <div class="hint" data-hint="${esc(p.description)}"></div></div>`).join("")}</div>` : `<p class="ident">This query takes no parameters.</p>`}
    <div id="code"></div>
    ${sec("What it reads and applies")}
    ${facts([["Tables", links(q.bases, tableLink)], ["Product", q.product ? productLink(q.product) : "shared by several products"],
      ["Rules", links(q.rules, ruleLink)], ["Returns", q.columns.length ? `<span class="mono">${q.columns.map(c => esc(c.name)).join(", ")}</span>` : ""],
      ["Authors", esc(q.authors.join(", "))], ["Files", `<span class="ident">${q.files.map(esc).join("<br>")}</span>`]])}
    ${q.tests.length ? sec("Tested behaviour", "the cases that run in CI, on synthetic rows") + q.tests.map((t, i) => `<div class="case"><p><b>${esc(t.id)}</b>${t.description ? " — " + esc(t.description) : ""}</p>
      <p>With ${Object.entries(t.parameters || {}).map(([k, v]) => `<code>${esc(k)}=${esc(v)}</code>`).join(", ") || "no parameters"}, it must return:
        ${Object.keys(t.parameters || {}).length ? `<button class="ghost" data-case="${i}">use these parameters</button>` : ""}</p>${grid(t.expected || [])}${inputsOf(t)}</div>`).join("") : ""}`;
  const box = main.querySelector("#code");
  const option = q.formatted ? `<label class="opt" title="Laid out by sqlglot: one clause per line"><input type="checkbox" id="fmt"> formatted</label>` : "";
  const draw = () => {
    const {wrong} = resolved(q, values);
    main.querySelectorAll(".field").forEach(f => {
      const p = q.parameters.find(x => x.name === f.dataset.p), hint = f.querySelector(".hint"), bad = wrong.includes(p.name);
      f.classList.toggle("bad", bad);
      hint.textContent = bad ? `Not a ${p.type}: ${p.format}` : [hint.dataset.hint, p.format].filter(Boolean).join(" · ");
    });

    "uv run statera doctor                    # where the data is read from, and what is missing", "uv run statera query list                # the recurring queries",
    "uv run statera query show <id> --help    # what one answers, and its parameters", "uv run statera query run <id> --param name=value --output result/"])},
  {name: "Python", lang: "python", text: lines(["from statera.consume import catalog", "", "cat = catalog.open()", 'cat.search(layer="gold")                # what there is, with its classification',
    'cat.table("gold.<table>").to_pandas()   # the data as it is now', 'cat.edition("<product>", "2026-06")     # exactly what was published', 'cat.query("<id>", uf="SP")              # a cataloged query'])},
];

// ---- the kinds of things, their index pages and the first page -------------------------------------
const KINDS = {
  queries: {many: "Recurring queries", one: "query", group: "ask", list: D.queries, key: "slug", view: viewQuery,
    title: q => q.title, text: q => q.description, ident: q => q.slug,
    chips: q => chip("", q.status) + chip("product", q.product) + chip("", q.parameters.map(p => p.name).join(", ") || "no parameters"),
    facets: {product: q => q.product || "shared", theme: q => q.theme, status: q => q.status},
    words: q => [q.id, q.theme, q.product, q.owner, q.limitations, ...q.bases, ...q.rules, ...q.parameters.map(p => p.name + " " + p.description), ...q.columns.map(c => c.name)].join(" "),
    intro: "Calculations that are asked for again and again: parameterized, tested and owned. Fill in the parameters and take the SQL, the command or the Python call. The result goes through the disclosure control its classification declares.",
    none: "No recurring query is cataloged yet. One is proposed by an issue or a pull request: queries/<theme>/<slug>/ with query.yaml, the SQL and a test."},
  metrics: {many: "Metrics", one: "metric", group: "ask", list: D.metrics, key: "name", view: viewMetric,
    title: m => m.label, text: m => m.description, ident: m => m.name,

    words: m => [m.name, m.expression, m.unit, ...dimensionsOf(m), ...(m.sources || []).map(s => s.table)].join(" "),
    intro: "Official numbers defined once, with the dimensions each may be broken down by. Two people who ask for the same metric get the same number.",
    none: "No metric is defined yet. Metrics are declared in a product's 5-process/metrics.yaml."},
  recipes: {many: "Recipes", one: "recipe", group: "ask", list: D.recipes, key: "path", view: viewRecipe,
    title: r => r.title, text: r => r.layers ? "Reads " + r.layers : "", ident: r => r.path,
    chips: r => chip("", LANGUAGE[r.language]) + chip("", r.classification), facets: {language: r => LANGUAGE[r.language]},
    words: r => [r.name, r.authors, r.text].join(" "),
    intro: "Short, complete examples to copy and adapt. Each one runs in CI against synthetic data, so a recipe that stops working is caught.",

  products: {many: "Products", one: "product", group: "there", list: D.products, key: "name", view: viewProduct,
