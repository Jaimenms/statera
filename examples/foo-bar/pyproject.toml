[project]
name = "statera-example-foo-bar"
version = "0.1.0"
description = "Minimal example content repository following the statera standard (synthetic data)"
readme = "content/README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = ["statera"]

[tool.uv]
package = false  # data repository: not a Python package

[tool.uv.sources]
statera = { path = "../..", editable = true }  # the framework in this repository

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["content/products"]
markers = ["slow: tests that run the full process (dbt)"]
