[project]
name = "statera-example-foo-bar"
version = "0.1.0"
description = "Minimal example content repository following the statera standard (synthetic data)"
readme = "content/README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = ["statera"]  # reading the data: catalog, queries, metrics

[tool.uv]
package = false  # data repository: not a Python package
default-groups = []  # production commands add the groups below by themselves

[tool.uv.sources]
statera = { path = "../..", editable = true }  # the framework in this repository

[dependency-groups]
produce = ["statera[produce]"]          # the data team: dbt and Copier
legacy-r = ["statera[legacy-r]"]        # baz_uf_monthly_median.R, through Rscript
legacy-spss = ["statera[legacy-spss]"]  # baz_uf_monthly.sps, through GNU PSPP
copilot = ["statera[copilot]"]          # statera copilot: questions in plain language, local model (Ollama)
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["content/products"]
markers = ["slow: tests that run the full process (dbt)"]
